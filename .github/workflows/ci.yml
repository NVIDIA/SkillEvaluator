name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.27"
      - run: uv sync --all-extras --locked --python "${{ matrix.python-version }}"
      - name: Scan OSS source boundary
        if: matrix.python-version == '3.12'
        run: python scripts/check_oss_boundary.py --root . --allowlist config/oss_boundary_allowlist.json
      - if: matrix.python-version == '3.12'
        run: uv run ruff check .
      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: >-
          uv run pytest -q
          --cov=skillevaluator
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
      - name: Run tests
        if: matrix.python-version != '3.12'
        run: uv run pytest -q

  sonarqube:
    name: SonarQube (NVIDIA network)
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'ci/christopherk/sonarqube-analysis'
    runs-on: [self-hosted, macOS, ARM64, sonar-internal]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Verify internal runner toolchain
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/toolcache
        run: |
          python3.12 --version
          uv --version
          mkdir -p "$RUNNER_TOOL_CACHE"
      - run: uv sync --all-extras --locked --python 3.12
      - name: Run tests with coverage
        run: >-
          uv run pytest -q
          --cov=skillevaluator
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
      - name: Normalize SonarQube credentials
        env:
          RAW_SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          RAW_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3.12 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          host_url = os.environ["RAW_SONAR_HOST_URL"].strip()
          token = os.environ["RAW_SONAR_TOKEN"].strip()
          if urlparse(host_url).scheme != "https" or not urlparse(host_url).hostname:
              raise SystemExit("SONAR_HOST_URL must be a valid HTTPS URL")
          if not token:
              raise SystemExit("SONAR_TOKEN is empty")

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"SONAR_HOST_URL={host_url}\n")
              env_file.write(f"SONAR_TOKEN={token}\n")
          PY
      - name: Analyze with SonarQube
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/toolcache
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.27"
      - name: Build wheel and source distribution
        run: |
          rm -rf dist
          uv build --python 3.13 --no-sources
      - name: Scan OSS source and built distributions
        run: python scripts/check_oss_boundary.py --root . --allowlist config/oss_boundary_allowlist.json --archive dist/*.whl --archive dist/*.tar.gz
      - name: Validate distribution metadata
        run: uvx --from twine==6.2.0 twine check --strict dist/*
      - name: Install and smoke-test the wheel
        shell: bash
        run: |
          wheel="$(find "$PWD/dist" -maxdepth 1 -type f -name 'skillevaluator-*.whl' -print -quit)"
          test -n "$wheel"
          venv="$RUNNER_TEMP/skillevaluator-wheel"
          uv venv --python 3.13 "$venv"
          uv pip install --python "$venv/bin/python" "${wheel}[tier3,llm]"
          cd "$RUNNER_TEMP"
          "$venv/bin/python" -c 'import anthropic, harbor, openai, skillevaluator, skillevaluator.model_catalog, skillevaluator.model_commands'
          "$venv/bin/python" -c 'from importlib.resources import files; assert files("skillevaluator.tier3.harbor").joinpath("templates/eval.py").is_file()'
          "$venv/bin/skillevaluator" --version
          "$venv/bin/skillevaluator" --help >/dev/null
          "$venv/bin/skillevaluator" models --help >/dev/null
          SKILL_EVAL_LLM_PROVIDER=nv_build NVIDIA_API_KEY=nvapi-ci-placeholder \
            "$venv/bin/skillevaluator" doctor --agents opencode --env-mode docker >/dev/null
          "$venv/bin/python" -c 'import io; from skillevaluator.tier3.harbor.progress import PlainProgressReporter,ProgressEvent,Tier3RunPlan; s=io.StringIO(); r=PlainProgressReporter(stream=s,refresh_interval=60); r.start(Tier3RunPlan(skill_name="wheel-smoke",environment="docker",agents=("opencode",))); r.emit(ProgressEvent(stage="configuration",state="complete")); r.close(); assert "configuration: complete" in s.getvalue()'

  tier3-macos:
    name: Tier 3 macOS contract and progress
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.27"
      - run: uv sync --all-extras --locked
      - run: >-
          uv run pytest -q
          tests/test_harbor_local_sandbox.py
          tests/test_harbor_local_mode.py
          tests/test_local_mode_contract.py
          tests/test_tier3_progress.py
          tests/test_tier3_result_display.py
          tests/test_harbor_runtime_preflight.py

  tier2-cross-platform:
    name: Tier 2 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.27"
      - run: uv sync --all-extras --locked
      - run: >-
          uv run pytest -q
          tests/embedding
          tests/deduplication
          tests/validators/test_similarity.py
          tests/reporting
          tests/test_cli.py
          tests/test_oss_packaging.py

  native-windows-local-mode:
    name: Native Windows local mode fails closed
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --all-extras --locked
      - run: >-
          uv run pytest -q
          tests/test_harbor_local_sandbox.py
          tests/test_harbor_local_mode.py
          -k native_windows
      - name: Verify the public CLI rejects native Windows local mode
        shell: pwsh
        env:
          COLUMNS: "200"
          SKILL_EVAL_LLM_PROVIDER: nv_build
          NVIDIA_API_KEY: nvapi-ci-placeholder
        run: |
          foreach ($mode in @("require", "prefer", "off")) {
            $env:SKILLEVALUATOR_LOCAL_SANDBOX = $mode
            $lines = & uv run skillevaluator doctor --agents opencode --env-mode local 2>&1
            $exitCode = $LASTEXITCODE
            $text = $lines -join [Environment]::NewLine
            $text | Write-Host
            if ($exitCode -eq 0) {
              throw "Native Windows local mode incorrectly passed with sandbox mode '$mode'."
            }
            if ($text -notmatch "Native Windows" -or $text -notmatch "unsupported") {
              throw "Missing native-Windows unsupported diagnostic for sandbox mode '$mode'."
            }
            if ($text -notmatch "WSL2" -or $text -notmatch "docker") {
              throw "Missing WSL2/Docker remediation for sandbox mode '$mode'."
            }
          }
          exit 0
