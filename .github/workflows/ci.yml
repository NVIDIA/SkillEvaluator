name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.27"
      - run: uv sync --all-extras --locked --python "${{ matrix.python-version }}"
      - if: matrix.python-version == '3.12'
        run: uv run ruff check .
      - run: uv run pytest -q

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.27"
      - name: Build wheel and source distribution
        run: |
          rm -rf dist
          uv build --python 3.13 --no-sources
      - name: Validate distribution metadata
        run: uvx --from twine==6.2.0 twine check --strict dist/*
      - name: Install and smoke-test the wheel
        shell: bash
        run: |
          wheel="$(find "$PWD/dist" -maxdepth 1 -type f -name 'skillevaluator-*.whl' -print -quit)"
          test -n "$wheel"
          venv="$RUNNER_TEMP/skillevaluator-wheel"
          uv venv --python 3.13 "$venv"
          uv pip install --python "$venv/bin/python" "${wheel}[tier3,llm]"
          cd "$RUNNER_TEMP"
          "$venv/bin/python" -c 'import anthropic, harbor, openai, skillevaluator'
          "$venv/bin/python" -c 'from importlib.resources import files; assert files("skillevaluator.tier3.harbor").joinpath("templates/eval.py").is_file()'
          "$venv/bin/skillevaluator" --version
          "$venv/bin/skillevaluator" --help >/dev/null

  tier2-cross-platform:
    name: Tier 2 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.27"
      - run: uv sync --all-extras --locked
      - run: >-
          uv run pytest -q
          tests/embedding
          tests/deduplication
          tests/validators/test_similarity.py
          tests/reporting
          tests/test_cli.py
          tests/test_oss_packaging.py
