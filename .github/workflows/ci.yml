name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: Classify changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify pull-request paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          classifier="$RUNNER_TEMP/classify_ci_changes.py"
          if ! git show "$BASE_SHA:scripts/classify_ci_changes.py" > "$classifier"; then
            echo "::notice::Trusted classifier is not present on the base branch; running full CI."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 "$classifier" --base "$BASE_SHA" --head "$HEAD_SHA"

  test-python-312:
    name: Tests (Python 3.12)
    needs: classify-changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        if: ${{ needs.classify-changes.outputs.docs_only != 'true' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Set up uv
        if: ${{ needs.classify-changes.outputs.docs_only != 'true' }}
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.27"
      - name: Install dependencies
        if: ${{ needs.classify-changes.outputs.docs_only != 'true' }}
        run: uv sync --all-extras --locked --python 3.12
      - name: Scan OSS source boundary
        if: ${{ needs.classify-changes.outputs.docs_only != 'true' }}
        run: python scripts/check_oss_boundary.py --root . --allowlist config/oss_boundary_allowlist.json
      - name: Lint committed BENCHMARK.md fixtures for leak patterns
        if: ${{ needs.classify-changes.outputs.docs_only != 'true' }}
        run: uv run python scripts/ci/check_public_benchmarks.py --require-files tests/golden --require-source-provenance
      - name: Lint
        if: ${{ needs.classify-changes.outputs.docs_only != 'true' }}
        run: uv run ruff check .
      # Fern validation takes seconds, so it runs before the test suite: a docs
      # break is reported early and is not hidden by a failing test.
      - name: Set up Node.js for docs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Validate Fern documentation
        shell: bash
        run: |
          set -euo pipefail
          # npm ci reproduces fern/package-lock.json exactly. tests/test_ci_workflows.py
          # asserts fern/package.json and fern/fern.config.json name the same version.
          npm ci --prefix fern --ignore-scripts --omit=optional
          FERN_VERSION="$(node -p "require('./fern/package.json').dependencies['fern-api']")"
          ./fern/node_modules/.bin/fern check
          {
            echo "### Fern documentation validation"
            echo
            echo "Validated docs and Fern configuration with Fern CLI $FERN_VERSION."
          } >> "$GITHUB_STEP_SUMMARY"
      # Pull requests run the suite in parallel without coverage, like the 3.13
      # and 3.14 jobs. No pull-request check reads the coverage report, and
      # tracing it on one core made this the slowest required job by far.
      - name: Run tests
        if: ${{ github.event_name == 'pull_request' && needs.classify-changes.outputs.docs_only != 'true' }}
        run: uv run pytest -q -n auto
      # Pushes to main keep the coverage run. It stays serial: under xdist,
      # coverage tracing pushed the time-bound tests past their limits (#261).
      - name: Run tests with coverage
        if: ${{ github.event_name != 'pull_request' }}
        run: >-
          uv run pytest -q
          --cov=skillevaluator
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

  test-python-313:
    name: Tests (Python 3.13)
    needs: classify-changes
    if: ${{ !cancelled() && needs.classify-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.27"
      - run: uv sync --all-extras --locked --python 3.13
      - name: Run tests
        run: uv run pytest -q -n auto

  test-python-314:
    name: Tests (Python 3.14)
    needs: classify-changes
    if: ${{ !cancelled() && needs.classify-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.27"
      - run: uv sync --all-extras --locked --python 3.14
      - name: Run tests
        run: uv run pytest -q -n auto

  html-parser-compatibility:
    name: HTML parser compatibility (Python ${{ matrix.python-version }})
    needs: classify-changes
    if: ${{ !cancelled() && needs.classify-changes.outputs.docs_only != 'true' }}
    # These older Python patch releases have setup-python builds for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12.11", "3.13.5"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.27"
      - run: uv sync --extra dev --locked --python "${{ matrix.python-version }}"
      - name: Run HTML parser compatibility tests
        run: >-
          uv run --python "${{ matrix.python-version }}" pytest -q
          tests/validators/test_markdown.py
          tests/test_cli_html_parser_compat.py

  mcp-sdk-compatibility:
    name: MCP probe compatibility (SDK ${{ matrix.mcp-version }})
    needs: classify-changes
    if: ${{ !cancelled() && needs.classify-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp-version: ["1.28.1", "2.3.0"]
    env:
      MCP_SDK_VERSION: ${{ matrix.mcp-version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.27"
      - name: Build the public wheel
        run: uv build --wheel --python 3.12 --no-sources
      - name: Install the isolated probe contract
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find "$PWD/dist" -maxdepth 1 -type f -name 'skillevaluator-*.whl' -print -quit)"
          test -n "$wheel"
          uv venv --python 3.12 "$RUNNER_TEMP/mcp-probe-compat"
          # Keep the public tier3 extra's supported SDK range unchanged. The
          # base wheel lets this forward-compatibility contract exercise SDK 2.
          # The direct legacy-client tests also need the original HTTP stack.
          uv pip install --python "$RUNNER_TEMP/mcp-probe-compat/bin/python" \
            "$wheel" "mcp==$MCP_SDK_VERSION" "pytest>=8.4.0" "httpx>=0.27"
      - name: Verify the installed probe with the selected SDK
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-probe-compat/bin/python" - <<'PY'
          import os
          import sys
          from importlib.metadata import version
          from pathlib import Path

          import skillevaluator

          assert version("mcp") == os.environ["MCP_SDK_VERSION"]
          assert Path(skillevaluator.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          PY
          "$RUNNER_TEMP/mcp-probe-compat/bin/python" -m pytest -q \
            tests/tier3/test_mcp_proof.py tests/tier3/test_mcp_proof_sdk_compat.py

  rhel8-security-install:
    name: RHEL 8 security install
    needs: classify-changes
    if: ${{ !cancelled() && needs.classify-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:8.10
    steps:
      - name: Install container prerequisites
        run: dnf install --assumeyes findutils git gzip tar
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.27"
      - name: Verify the RHEL 8 glibc baseline
        run: test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
      - name: Build the wheel
        run: uv build --wheel --python 3.12 --no-sources
      - name: Install the wheel with the security extra
        shell: bash
        run: |
          wheel="$(find "$PWD/dist" -maxdepth 1 -type f -name 'skillevaluator-*.whl' -print -quit)"
          test -n "$wheel"
          uv venv --python 3.12 .rhel8-security-venv
          uv pip install --python .rhel8-security-venv/bin/python "${wheel}[security]"
      - name: Smoke-test the bundled Python scanners
        run: |
          .rhel8-security-venv/bin/python - <<'PY'
          from importlib.metadata import version
          from packaging.version import Version

          assert Version(version("bandit")) >= Version("1.9.4")
          assert Version(version("pip-audit")) >= Version("2.10.0")
          PY
          .rhel8-security-venv/bin/bandit --version
          .rhel8-security-venv/bin/pip-audit --version

  package:
    name: Package
    needs: classify-changes
    if: ${{ !cancelled() && needs.classify-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.27"
      - name: Build wheel and source distribution
        run: |
          rm -rf dist
          uv build --python 3.13 --no-sources
      - name: Scan OSS source and built distributions
        run: python scripts/check_oss_boundary.py --root . --allowlist config/oss_boundary_allowlist.json --archive dist/*.whl --archive dist/*.tar.gz
      - name: Validate distribution metadata
        run: uvx --from twine==6.2.0 twine check --strict dist/*
      - name: Verify onboarding from the base wheel
        shell: bash
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/skillevaluator-base"
          uv pip install --python "$RUNNER_TEMP/skillevaluator-base/bin/python" dist/*.whl
          "$RUNNER_TEMP/skillevaluator-base/bin/python" - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from importlib.resources import files
          from pathlib import Path

          release = json.loads(files("skillevaluator").joinpath("ci-release.json").read_text())
          assert release["repository"] == "NVIDIA/SkillEvaluator"
          command = [str(Path(sys.executable).with_name("skillevaluator"))]
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              subprocess.run(["git", "init", "-b", "main", directory], check=True)
              subprocess.run(["git", "-C", directory, "remote", "add", "origin", "https://github.com/example/skills.git"], check=True)
              (root / "skills" / "smoke-check").mkdir(parents=True)
              (root / "skills" / "smoke-check" / "SKILL.md").write_text("---\nname: smoke-check\ndescription: Smoke check skill\n---\n# Smoke check\n")
              subprocess.run(["git", "-C", directory, "add", "skills"], check=True)
              for feedback in ("--checks-only", "--full"):
                  subprocess.run(command + ["ci", "init", "--repo", directory, "--default-branch", "main", "--mode", "preview", "--no-input", feedback], check=True)
              assert not (root / ".github").exists(), "Preview changed the consumer checkout"
          PY
      - name: Install and smoke-test the wheel on Python 3.12, 3.13, and 3.14
        shell: bash
        run: |
          wheel="$(find "$PWD/dist" -maxdepth 1 -type f -name 'skillevaluator-*.whl' -print -quit)"
          test -n "$wheel"
          for python_version in 3.12 3.13 3.14; do
            venv="$RUNNER_TEMP/skillevaluator-wheel-${python_version}"
            uv venv --python "$python_version" "$venv"
            uv pip install --python "$venv/bin/python" "${wheel}[tier3]"
            cd "$RUNNER_TEMP"
            "$venv/bin/python" -c 'import anthropic, harbor, openai, skillevaluator, skillevaluator.model_catalog, skillevaluator.model_commands'
            "$venv/bin/python" -c 'from importlib.resources import files; assert files("skillevaluator.tier3.harbor").joinpath("templates/eval.py").is_file()'
            "$venv/bin/python" -c 'from importlib.resources import files; from skillevaluator.quality_config import load_quality_config; assert files("skillevaluator.config").joinpath("quality-default.yaml").is_file(); c=load_quality_config(); assert [h["heading"] for h in c["expected_headers"]]==["## Prerequisites","## Limitations","## Troubleshooting"], c'
            "$venv/bin/skillevaluator" --version
            "$venv/bin/skillevaluator" --help >/dev/null
            "$venv/bin/skillevaluator" models --help >/dev/null
            "$venv/bin/skillevaluator" ci --help >/dev/null
            SKILL_EVAL_LLM_PROVIDER=nv_build NVIDIA_API_KEY=nvapi-ci-placeholder \
              "$venv/bin/skillevaluator" doctor --agents opencode --env-mode docker >/dev/null
            "$venv/bin/python" -c 'import io; from skillevaluator.tier3.harbor.progress import PlainProgressReporter,ProgressEvent,Tier3RunPlan; s=io.StringIO(); r=PlainProgressReporter(stream=s,refresh_interval=60); r.start(Tier3RunPlan(skill_name="wheel-smoke",environment="docker",agents=("opencode",))); r.emit(ProgressEvent(stage="configuration",state="complete")); r.close(); assert "configuration: complete" in s.getvalue()'
          done
      - name: Run the installed verifier with Python 3.9
        shell: bash
        run: |
          task_python="$RUNNER_TEMP/skillevaluator-verifier-39/bin/python"
          uv venv --python 3.9 "$RUNNER_TEMP/skillevaluator-verifier-39"
          uv pip install --python "$task_python" idna==3.11
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/skillevaluator-wheel-3.12/bin/python" \
            "$GITHUB_WORKSPACE/scripts/ci/smoke_harbor_verifier.py" --python "$task_python"

  tier3-macos:
    name: Tier 3 macOS contract and progress
    needs: classify-changes
    if: ${{ !cancelled() && needs.classify-changes.outputs.docs_only != 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.27"
      - run: uv sync --all-extras --locked
      - run: >-
          uv run pytest -q
          tests/test_harbor_local_sandbox.py
          tests/test_harbor_local_mode.py
          tests/test_local_mode_contract.py
          tests/validators/test_rubric_eval.py
          tests/test_tier3_progress.py
          tests/test_tier3_result_display.py
          tests/test_harbor_runtime_preflight.py

  tier2-macos:
    name: Tier 2 (macos-latest)
    needs: classify-changes
    if: ${{ !cancelled() && needs.classify-changes.outputs.docs_only != 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.27"
      - run: uv sync --all-extras --locked
      - run: >-
          uv run pytest -q
          tests/embedding
          tests/deduplication
          tests/validators/test_similarity.py
          tests/reporting
          tests/test_cli.py
          tests/test_oss_packaging.py

  tier2-windows:
    name: Tier 2 (windows-latest)
    needs: classify-changes
    if: ${{ !cancelled() && needs.classify-changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.27"
      - run: uv sync --all-extras --locked
      - run: >-
          uv run pytest -q
          tests/embedding
          tests/deduplication
          tests/validators/test_similarity.py
          tests/validators/test_rubric_eval.py
          tests/reporting
          tests/test_cli.py
          tests/test_cli_stdout_encoding.py
          tests/test_harbor_output_provenance.py
          tests/test_harbor_runner_status.py
          tests/test_harbor_runtime_skill_isolation.py
          tests/test_publication_identity.py
          tests/test_harbor_secure_copy.py::test_checked_windows_fallback_accepts_crt_descriptor_identity
          tests/test_harbor_secure_copy.py::test_checked_windows_fallback_verifies_portable_chmod_semantics
          tests/test_harbor_secure_copy.py::test_native_windows_fallback_copies_tree_and_file
          tests/test_harbor_secure_copy.py::test_native_windows_tree_fingerprint_binds_writable_mode
          tests/test_issue55_collector_truth.py::test_diagnostic_copy_preserves_bounded_redacted_regular_file
          tests/test_issue55_collector_truth.py::test_diagnostic_copy_rejects_hard_linked_artifact
          tests/test_issue55_collector_truth.py::test_diagnostic_copy_rejects_native_windows_trial_root_junction
          tests/test_issue55_collector_truth.py::test_diagnostic_copy_rejects_native_windows_agent_junction
          tests/test_issue55_collector_truth.py::test_diagnostic_copy_rejects_native_windows_destination_parent_junction
          tests/test_issue55_collector_truth.py::test_judge_sidecar_scan_rejects_native_windows_verifier_junction
          tests/test_results_location.py
          tests/test_results_location_legacy_compatibility.py
          tests/test_tier3_compare.py
          tests/test_tier3_progress.py
          tests/utils/test_secure_fs_selected_reads.py
          tests/utils/test_secure_fs_platform.py
          tests/utils/test_secure_fs_bounded.py
          tests/test_plugin_discovery.py
          tests/test_oss_packaging.py

  ci-onboarding-windows:
    name: CI onboarding (native Windows)
    needs: classify-changes
    if: ${{ !cancelled() && needs.classify-changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.27"
      - name: Install onboarding test dependencies
        run: uv sync --extra dev --locked --python 3.12
      - name: Test onboarding and native workflow writes
        shell: pwsh
        run: |
          $onboardingTests = @(Get-ChildItem tests -Filter "test_ci_onboarding*.py" | Sort-Object Name | ForEach-Object { $_.FullName })
          if ($onboardingTests.Count -eq 0) { throw "No onboarding tests were found." }
          uv run --no-sync pytest -q @onboardingTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and install the base wheel
        shell: pwsh
        run: |
          uv build --wheel --no-sources --python 3.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem dist -Filter "skillevaluator-*.whl")
          if ($wheels.Count -ne 1) { throw "Expected exactly one freshly built wheel." }
          $baseEnvironment = Join-Path $env:RUNNER_TEMP "skillevaluator-onboarding-base-windows"
          uv venv --python 3.12 $baseEnvironment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $basePython = Join-Path $baseEnvironment "Scripts\python.exe"
          uv pip install --python $basePython $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test the installed Windows CLI with a CRLF checkout
        shell: pwsh
        run: |
          $basePython = Join-Path $env:RUNNER_TEMP "skillevaluator-onboarding-base-windows\Scripts\python.exe"
          @'
          import importlib.util
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          assert sys.platform == "win32"
          assert importlib.util.find_spec("harbor") is None
          assert importlib.util.find_spec("pytest") is None
          command = [str(Path(sys.executable).with_name("skillevaluator.exe"))]
          assert Path(command[0]).is_file()
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory) / "consumer"
              root.mkdir()
              def git(*args, **kwargs):
                  return subprocess.run(["git", "-c", "commit.gpgsign=false", "-C", str(root), *args], check=True, **kwargs)
              git("init", "-b", "main")
              git("config", "user.name", "Windows onboarding smoke")
              git("config", "user.email", "onboarding-smoke@example.com")
              git("config", "core.autocrlf", "true")
              git("remote", "add", "origin", "https://github.com/example/skills.git")
              skill = root / "skills" / "smoke-check" / "SKILL.md"
              skill.parent.mkdir(parents=True)
              skill.write_bytes(b"---\r\nname: smoke-check\r\ndescription: Smoke check skill\r\n---\r\n# Smoke check\r\n")
              git("add", "skills")
              git("commit", "-m", "Add smoke skill")
              common = command + ["ci", "init", "--repo", str(root), "--no-input"]
              for feedback in ("--checks-only", "--full"):
                  subprocess.run(common + ["--mode", "preview", feedback], check=True)
              assert not (root / ".github").exists(), "Preview changed the checkout"
              subprocess.run(common + ["--mode", "save", "--checks-only"], check=True)
              git("add", ".github")
              git("commit", "-m", "Add checks")
              scan_path = ".github/workflows/skill-checks.yml"
              # Force a fresh checkout: checkout-index can keep an existing
              # up-to-date LF file even when core.autocrlf is enabled.
              (root / scan_path).unlink()
              git("checkout-index", "--index", "--force", "--", scan_path)
              assert b"\r\n" in (root / scan_path).read_bytes()
              receipt = Path(directory) / "onboarding.json"
              subprocess.run(common + ["--mode", "save", "--full", "--output", str(receipt)], check=True)
              assert (root / ".github/workflows/publish-skill-reports.yml").is_file()
              actual_blob = git("hash-object", "--path=" + scan_path, "--stdin", input=(root / scan_path).read_bytes(), capture_output=True).stdout.decode().strip()
              assert json.loads(receipt.read_text())["scan_blob"] == actual_blob
              subprocess.run(common + ["--mode", "save", "--full"], check=True)
          '@ | & $basePython -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  native-windows-local-mode:
    name: Native Windows local mode fails closed
    needs: classify-changes
    if: ${{ !cancelled() && needs.classify-changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --all-extras --locked
      - run: >-
          uv run pytest -q
          tests/test_harbor_local_sandbox.py
          tests/test_harbor_local_mode.py
          -k native_windows
      - name: Verify the public CLI rejects native Windows local mode
        shell: pwsh
        env:
          COLUMNS: "200"
          SKILL_EVAL_LLM_PROVIDER: nv_build
          NVIDIA_API_KEY: nvapi-ci-placeholder
        run: |
          foreach ($mode in @("require", "prefer", "off")) {
            $env:SKILLEVALUATOR_LOCAL_SANDBOX = $mode
            $lines = & uv run skillevaluator doctor --agents opencode --env-mode local 2>&1
            $exitCode = $LASTEXITCODE
            $text = $lines -join [Environment]::NewLine
            $text | Write-Host
            if ($exitCode -eq 0) {
              throw "Native Windows local mode incorrectly passed with sandbox mode '$mode'."
            }
            if ($text -notmatch "Native Windows" -or $text -notmatch "unsupported") {
              throw "Missing native-Windows unsupported diagnostic for sandbox mode '$mode'."
            }
            if ($text -notmatch "WSL2" -or $text -notmatch "docker") {
              throw "Missing WSL2/Docker remediation for sandbox mode '$mode'."
            }
          }
          exit 0
