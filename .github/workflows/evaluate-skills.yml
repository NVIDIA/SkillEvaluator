name: Reusable Tier 1 skill checks
# The image selects the bundled default policy for both public and private repos.
# Policy rules do not control repository visibility or optional report hosting.
on:
  workflow_call:
    inputs:
      image:
        description: Published Tier 1 image pinned to a GHCR sha256 digest
        type: string
        required: true
      scan-mode:
        description: auto scans changed skills on PRs and all skills otherwise; all forces a full scan
        type: string
        default: auto
      paths:
        description: Newline-separated skill directories or roots containing skills
        type: string
        default: skills
      min-score:
        description: Minimum Tier 1 quality score from 0 to 100
        type: number
        default: 70
      enforcement-mode:
        description: strict fails on non-passing Tier 1 results; advisory uploads evidence without blocking on verdict
        type: string
        default: strict
      llm:
        description: Enable additional LLM security, verification, and rubric checks
        type: boolean
        default: false
      llm-provider:
        description: openai, anthropic, or nv_build
        type: string
        default: openai
      llm-model:
        description: Optional provider model override
        type: string
        default: ''
      artifact-name:
        description: Unique name when calling the workflow more than once
        type: string
        default: skill-evaluator-tier1
      report-base-url:
        description: Optional GitHub Pages report site for stable links
        type: string
        default: ''
      scan-workers:
        description: Skills scanned at once, 1 to 16; 1 scans one skill at a time
        type: number
        default: 4
      security-baselines:
        description: Apply per-skill baselines from the reviewed target/current commit manifest
        type: boolean
        default: false
      upload-sarif:
        description: Upload complete full-scan SARIF to GitHub Code Scanning
        type: boolean
        default: false
      sarif-category:
        description: Stable Code Scanning category, unique to this scan configuration
        type: string
        default: skillevaluator
    secrets:
      LLM_API_KEY:
        required: false
# Inherit the caller's permissions: basic scans need only contents: read.
# Hosted reports additionally opt in to id-token: write in the caller.
# Code Scanning publication additionally requires security-events: write.
jobs:
  tier1:
    name: Tier 1 scan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SCAN_MODE: ${{ inputs.scan-mode == 'auto' && (github.event_name == 'pull_request' && 'changed' || 'all') || inputs.scan-mode }}
    steps:
      - name: Validate enforcement mode
        env:
          ENFORCEMENT_MODE: ${{ inputs.enforcement-mode }}
        run: |
          python3 -I - <<'PY'
          import os
          mode = os.environ["ENFORCEMENT_MODE"]
          if mode not in {"strict", "advisory"}:
              raise SystemExit("enforcement-mode must be strict or advisory")
          PY
      - name: Capture the optional hosted-report execution receipt
        id: provenance
        continue-on-error: true
        run: |
          python3 -I - <<'PY'
          import json, os, re, tempfile, urllib.parse, urllib.request

          url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL")
          credential = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          if not url or not credential:
              print("Hosted-report receipt is disabled; scan artifacts remain available.")
              raise SystemExit(0)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          try:
              parsed = urllib.parse.urlsplit(url)
              if (parsed.scheme != "https" or not parsed.hostname
                  or not parsed.hostname.endswith(".actions.githubusercontent.com")
                  or parsed.port not in (None, 443) or parsed.username or parsed.password
                  or parsed.fragment):
                  raise ValueError("Unexpected GitHub identity endpoint")
              audience = "urn:skillevaluator:report-provenance:v1"
              url += ("&" if parsed.query else "?") + "audience=" + urllib.parse.quote(audience, safe="")
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + credential})
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
                  payload = response.read(65537)
              if len(payload) > 65536:
                  raise ValueError("Oversized identity response")
              token = json.loads(payload)["value"]
              if (not isinstance(token, str) or len(token) > 32768
                  or not re.fullmatch(r"[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+", token)):
                  raise ValueError("Invalid identity response")
              directory = tempfile.mkdtemp(prefix="skill-provenance-", dir=os.environ["RUNNER_TEMP"])
              descriptor = os.open(os.path.join(directory, "execution.jwt"), os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(descriptor, "w") as handle:
                  handle.write(token)
              with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
                  handle.write("directory=" + directory + "\n")
              print("Captured the signed execution receipt for hosted reports.")
          except (OSError, ValueError, KeyError, TypeError):
              raise SystemExit("Could not capture the hosted-report receipt. Scan artifacts remain available; hosting will be skipped.") from None
          PY
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          # Changed mode needs commits and trees for the merge base, not old
          # file contents. Reviewed baselines need target-commit blobs too,
          # including when all skills are selected; the container cannot fetch.
          fetch-depth: ${{ !inputs.security-baselines && env.SCAN_MODE != 'changed' && 1 || 0 }}
          filter: ${{ !inputs.security-baselines && env.SCAN_MODE == 'changed' && 'blob:none' || '' }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate the immutable image reference
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          python3 -I - <<'PY'
          import os, re
          if not re.fullmatch(r"ghcr\.io/[a-z0-9][a-z0-9._/-]*@sha256:[0-9a-f]{64}", os.environ["IMAGE"]):
              raise SystemExit("image must be a published GHCR image pinned to its sha256 digest")
          PY
      - name: Pull the published image without registry credentials
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/anonymous-docker-config"
          docker --config "$RUNNER_TEMP/anonymous-docker-config" pull "$IMAGE"
      - name: Evaluate selected skills
        id: scan
        env:
          ENFORCEMENT_MODE: ${{ inputs.enforcement-mode }}
          IMAGE: ${{ inputs.image }}
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SECURITY_BASELINES: ${{ inputs.security-baselines }}
          POLICY_SOURCE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          SKILL_PATHS: ${{ inputs.paths }}
          MIN_SCORE: ${{ inputs.min-score }}
          LLM_ENABLED: ${{ inputs.llm }}
          LLM_PROVIDER: ${{ inputs.llm-provider }}
          LLM_MODEL: ${{ inputs.llm-model }}
          LLM_API_KEY: ${{ inputs.llm && secrets.LLM_API_KEY || '' }}
          REPORT_BASE_URL: ${{ inputs.report-base-url }}
          SCAN_WORKERS: ${{ inputs.scan-workers }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/skill-reports"
          REPORT_IMAGE="$IMAGE"
          REPORT_URL=""
          if [ -n "$REPORT_BASE_URL" ]; then
            REPORT_URL="${REPORT_BASE_URL%/}/runs/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/"
          fi
          export REPORT_IMAGE REPORT_URL
          llm_secret_args=()
          if [ "$LLM_ENABLED" = true ]; then
            llm_secret_args=(--env LLM_API_KEY)
          fi
          enforcement_args=()
          if [ "$ENFORCEMENT_MODE" = advisory ]; then
            enforcement_args=(--enforcement-mode advisory)
          fi
          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            --read-only --tmpfs /tmp:rw,nosuid,noexec,size=1g \
            --tmpfs /audit-tmp:rw,nosuid,noexec,mode=1777,size=1g --env TMPDIR=/audit-tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/skill-reports,dst=/reports" \
            --env SKILL_PATHS --env MIN_SCORE --env LLM_ENABLED --env LLM_PROVIDER --env LLM_MODEL "${llm_secret_args[@]}" \
            --env SCAN_MODE --env DIFF_BASE_SHA --env DIFF_HEAD_SHA --env SCAN_WORKERS \
            --env SECURITY_BASELINES --env POLICY_SOURCE_SHA \
            --env CALLER_WORKFLOW_SHA \
            --env GITHUB_ACTIONS --env REPORT_IMAGE --env REPORT_URL --env REPORT_RUN_URL --env REPORT_COMMIT \
            "$IMAGE" "${enforcement_args[@]}"
          status=$?
          set -e
          echo "exit-code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Add the result to the workflow summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/skill-reports/summary.md" ]; then
            cat "$RUNNER_TEMP/skill-reports/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Tier 1 did not complete. Inspect the failed step above.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload reports even when validation fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain the separate hosted-report execution receipt
        if: ${{ always() && steps.provenance.outputs.directory != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-provenance-attempt-${{ github.run_attempt }}
          path: ${{ steps.provenance.outputs.directory }}/execution.jwt
          if-no-files-found: error
          retention-days: 14
      # The optional report publisher downloads only this JSON evidence, not the full reports.
      - name: Upload publisher evidence even when validation fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-evidence-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/skill-reports/summary.json
            ${{ runner.temp }}/skill-reports/skill-*/skillevaluator-tier1.json
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare complete SARIF for Code Scanning
        id: sarif
        if: ${{ always() && !cancelled() && inputs.upload-sarif }}
        env:
          IMAGE: ${{ inputs.image }}
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          SARIF_CATEGORY: ${{ inputs.sarif-category }}
          EVENT_NAME: ${{ github.event_name }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [[ -z "${SARIF_CATEGORY//[[:space:]]/}" ]]; then
            echo "::error::sarif-category must not be empty"
            exit 1
          fi
          if [ "$SCAN_MODE" = changed ]; then
            echo "Code Scanning upload skipped: changed-only scans cannot replace a complete baseline."
            exit 0
          fi
          if [ "$EVENT_NAME" = pull_request_target ]; then
            echo "::error::Code Scanning upload is not supported on pull_request_target."
            exit 1
          fi
          if [ "$FORK_PR" = true ]; then
            echo "::warning::Code Scanning upload skipped: fork PR uploads cannot target the scanned head commit. The scan verdict is unchanged."
            exit 0
          fi
          if [ "$SCAN_EXIT_CODE" != 0 ] && [ "$SCAN_EXIT_CODE" != 1 ]; then
            echo "::error::Code Scanning upload skipped: the scan did not finish normally."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/skill-sarif"
          docker run --rm -i --user "$(id -u):$(id -g)" \
            --read-only --tmpfs /tmp:rw,nosuid,noexec,size=1g \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$RUNNER_TEMP/skill-reports,dst=/reports,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/skill-sarif,dst=/output" \
            --workdir /tmp --entrypoint python "$IMAGE" -I - /reports /output <<'PY'
          import json, os, pathlib, sys, urllib.parse
          from skillevaluator.reporting.sarif_reporter import merge_catalog_sarif_documents

          MAX_DISPLAYED_RESULTS = 5_000
          MAX_RESULTS_PER_RUN = 25_000

          reports, output = map(pathlib.Path, sys.argv[1:])

          def normalize_location(location, skill):
              physical = location.get("physicalLocation")
              if not physical or "artifactLocation" not in physical:
                  return
              artifact = physical["artifactLocation"]
              uri = urllib.parse.urlsplit(artifact["uri"])
              if uri.query or uri.fragment or uri.netloc or uri.scheme not in ("", "file"):
                  raise ValueError("a SARIF location cannot be mapped to the workspace")
              path = pathlib.PurePosixPath(os.fsdecode(urllib.parse.unquote_to_bytes(uri.path)))
              if path.is_absolute():
                  if uri.scheme != "file" or not path.is_relative_to("/workspace"):
                      raise ValueError("a SARIF location is outside the workspace")
                  path = path.relative_to("/workspace")
              elif uri.scheme:
                  raise ValueError("a SARIF location cannot be mapped to the workspace")
              else:
                  path = pathlib.PurePosixPath(skill) / path
              if ".." in path.parts:
                  raise ValueError("a SARIF location escapes the workspace")
              artifact["uri"] = urllib.parse.quote(os.fsencode(str(path)), safe="/")

          try:
              summary = json.loads((reports / "summary.json").read_text(encoding="utf-8"))
              selection = summary["selection"]
              rows = summary["skills"]
              selected = selection["selected"]
              if (selection["mode"] != "all" or not isinstance(rows, list)
                  or not isinstance(selected, list) or not selected
                  or len(rows) != len(selected) or summary["total"] != len(rows)
                  or selection["discovered"] != len(rows)
                  or [row["path"] for row in rows] != selected
                  or summary.get("error")):
                  raise ValueError("the full scan selection is missing or inconsistent")
              documents = []
              for index, row in enumerate(rows, 1):
                  if (row["report_dir"] != f"skill-{index:03d}"
                      or row["overall_status"] not in ("passed", "failed")
                      or row["incomplete_scans"] != []
                      or row["exit_code"] not in (0, 1) or row.get("error")):
                      raise ValueError("one or more skills did not complete")
                  path = reports / row["report_dir"] / "skillevaluator-tier1.sarif.json"
                  if path.is_symlink() or not path.is_file():
                      raise ValueError("a skill SARIF report is missing")
                  document = json.loads(path.read_text(encoding="utf-8"))
                  runs = document["runs"]
                  if (document["version"] != "2.1.0" or not isinstance(runs, list) or len(runs) != 1
                      or not isinstance(runs[0], dict)):
                      raise ValueError("a skill SARIF report has an invalid version or runs")
                  run = runs[0]
                  driver = run["tool"]["driver"]
                  if (not isinstance(driver, dict) or not isinstance(driver.get("name"), str)
                      or not driver["name"] or not isinstance(driver.get("rules"), list)
                      or any(not isinstance(rule, dict) or not isinstance(rule.get("id"), str)
                             or not rule["id"] for rule in driver["rules"])
                      or not isinstance(run.get("results"), list)
                      or any(not isinstance(result, dict) for result in run["results"])
                      or not isinstance(run.get("invocations"), list) or not run["invocations"]
                      or any(not isinstance(invocation, dict) or invocation.get("executionSuccessful") is not True
                             for invocation in run.get("invocations", []))):
                      raise ValueError("a skill SARIF report is malformed or incomplete")
                  for result in run["results"]:
                      for location in result.get("locations", []):
                          normalize_location(location, row["path"])
                  documents.append(document)
              merged = merge_catalog_sarif_documents(documents)
              # upload-sarif only applies its category when automationDetails is absent.
              merged["runs"][0].pop("automationDetails", None)
              result_count = sum(len(run["results"]) for run in merged["runs"])
              if result_count > MAX_DISPLAYED_RESULTS:
                  warning = (
                      f"SARIF contains {result_count} results; GitHub displays only the "
                      f"{MAX_DISPLAYED_RESULTS:,} highest-priority results."
                  )
                  if result_count > MAX_RESULTS_PER_RUN:
                      warning += (
                          f" GitHub rejects SARIF runs over {MAX_RESULTS_PER_RUN:,} results, "
                          "but upload will still be attempted."
                      )
                  print(f"::warning::{warning}", flush=True)
              (output / "catalog.sarif.json").write_text(json.dumps(merged), encoding="utf-8")
          except (OSError, ValueError, TypeError, KeyError, IndexError) as exc:
              raise SystemExit(f"Code Scanning upload skipped: missing, malformed, or incomplete scan evidence ({exc}).")
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Upload SARIF to GitHub Code Scanning
        if: ${{ always() && !cancelled() && steps.sarif.outputs.ready == 'true' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/skill-sarif/catalog.sarif.json
          category: ${{ inputs.sarif-category }}
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
