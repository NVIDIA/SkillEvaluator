name: Verify Tier 1 image

on:
  pull_request:
    paths:
      - ci/**
      - src/skillevaluator/**
      - pyproject.toml
      - uv.lock
      - .dockerignore
      - .github/workflows/publish-tier1-image.yml
      - .github/workflows/release-tier1-image.yml
  # Builds on main seed the layer cache that pull requests read.
  push:
    branches:
      - main
    paths:
      - ci/**
      - src/skillevaluator/**
      - pyproject.toml
      - uv.lock
      - .dockerignore
      - .github/workflows/publish-tier1-image.yml
      - .github/workflows/release-tier1-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the complete Tier 1 runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ci/Dockerfile.tier1
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: skillevaluator-tier1:verify
          load: true
          provenance: false
          # Every verify run reads the layer cache that main writes. Only runs on main write it, so a pull
          # request cannot replace the layers that later main builds reuse.
          cache-from: type=gha,scope=tier1-image
          cache-to: >-
            ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
            'type=gha,scope=tier1-image,mode=max,ignore-error=true' || '' }}
      - name: Exercise real scans and changed-skill selection
        run: python3 ci/smoke_image.py --image skillevaluator-tier1:verify --output "$RUNNER_TEMP/image-verification"
      - name: Retain integration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tier1-image-verification
          path: ${{ runner.temp }}/image-verification
          if-no-files-found: error
          retention-days: 14
