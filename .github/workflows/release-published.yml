name: SkillEvaluator release published
on:
  release:
    types: [published]

permissions: {}

jobs:
  notify:
    if: github.repository == 'NVIDIA/SkillEvaluator' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "A stable release was published."
