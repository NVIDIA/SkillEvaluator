name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Private/internal repositories can opt in after GitHub Advanced Security is
# enabled by setting ENABLE_GITHUB_ADVANCED_SECURITY=true.
jobs:
  classify-changes:
    name: Classify changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify pull-request paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          classifier="$RUNNER_TEMP/classify_ci_changes.py"
          if ! git show "$BASE_SHA:scripts/classify_ci_changes.py" > "$classifier"; then
            echo "::notice::Trusted classifier is not present on the base branch; running full CI."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 "$classifier" --base "$BASE_SHA" --head "$HEAD_SHA"

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify full Git checkout
        run: |
          test -d .git
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git rev-parse --verify "HEAD^{commit}" >/dev/null
      - name: Scan Git history
        # Pull requests and main pushes scan only history reachable from the
        # checked-out commit. Audits keep --all so unmerged refs and tags stay
        # covered. Re-derive these v8.30.0 options when bumping the image.
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request|push)
              log_opts="--full-history --diff-filter=tuxdb HEAD --"
              ;;
            # Unknown future events deliberately receive the wider audit.
            *)
              log_opts="--full-history --all --diff-filter=tuxdb --"
              ;;
          esac

          docker run --rm \
            --volume "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git --no-banner --redact --verbose \
            --log-opts="$log_opts" /repo

  dependency-review:
    name: Dependency review
    needs: classify-changes
    if: >-
      ${{ !cancelled() &&
          needs.classify-changes.outputs.docs_only != 'true' &&
          github.event_name == 'pull_request' &&
          (github.event.repository.private == false || vars.ENABLE_GITHUB_ADVANCED_SECURITY == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  codeql:
    name: CodeQL
    needs: classify-changes
    if: >-
      ${{ !cancelled() &&
          needs.classify-changes.outputs.docs_only != 'true' &&
          (github.event.repository.private == false || vars.ENABLE_GITHUB_ADVANCED_SECURITY == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
