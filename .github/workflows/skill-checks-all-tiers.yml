# Generated by SkillEvaluator all-tier CI onboarding.
name: Skill checks (all tiers)
'on':
  pull_request:
    paths:
    - skills/**
    - .github/workflows/skill-checks-all-tiers.yml
    - .github/workflows/skill-feedback-all-tiers.yml
  push:
    branches:
    - main
    paths:
    - skills/**
    - .github/workflows/skill-checks-all-tiers.yml
    - .github/workflows/skill-feedback-all-tiers.yml
  workflow_dispatch: null
permissions:
  contents: read
  id-token: write
  pull-requests: read
  actions: read
jobs:
  skills:
    uses: NVIDIA/SkillEvaluator/.github/workflows/evaluate-all-tiers.yml@80ef7b626128a4f54e35d24bc4b73eedf637e559
    with:
      tiers: 1,2,3
      paths: skills
      min-score: 70
      scan-mode: auto
      env-mode: docker
      provider: nv_build
      embedding-provider: nv_build
      model: nvidia/nemotron-3.5-lightning-30b-a3b
      embedding-model: ''
      agents: codex,claude-code
      runner: ubuntu-24.04
      tools-repository: NVIDIA/SkillEvaluator
      tools-ref: 80ef7b626128a4f54e35d24bc4b73eedf637e559
      image: ghcr.io/nvidia/skillevaluator-tier1@sha256:9d5483243918937be4f2178f74cf7c622a531dee41e3176906994d52fa14950a
      n-attempts: 1
      n-concurrent: 1
      timeout-minutes: 300
      environment: skillevaluator
      tier1-llm: true
      tier1-provider: nv_build
      tier1-model: nvidia/nemotron-3.5-super-vl-120b-a12b
      tier3-provider: openai-compatible
      tier3-model: us/aws/anthropic/eccn-claude-opus-4-8
      tier3-base-url: ${{ vars.SKILL_EVAL_TIER3_BASE_URL }}
      agent-models: |-
        codex=openai/openai/eccn-gpt-6.1-sol
        claude-code=aws/anthropic/eccn-claude-opus-5-5
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      LLM_API_KEY: ${{ secrets[vars.SKILL_EVAL_GATEWAY_SECRET] }}
