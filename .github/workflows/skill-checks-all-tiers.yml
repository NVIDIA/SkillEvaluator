# Generated by SkillEvaluator all-tier CI onboarding.
name: Skill checks (all tiers)
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
  id-token: write
  pull-requests: read
  actions: read
jobs:
  skills:
    uses: NVIDIA/SkillEvaluator/.github/workflows/evaluate-all-tiers.yml@86f1a1f05bc5f73e1c0ee3e8bff0b5ff062913f4
    with:
      tiers: 1,2,3
      paths: skills
      min-score: 70
      scan-mode: auto
      env-mode: docker
      provider: nv_build
      embedding-provider: nv_build
      model: nvidia/nemotron-3.5-lightning-30b-a3b
      embedding-model: ''
      agents: ''
      runner: ubuntu-24.04
      tools-repository: NVIDIA/SkillEvaluator
      tools-ref: 86f1a1f05bc5f73e1c0ee3e8bff0b5ff062913f4
      image: ghcr.io/nvidia/skillevaluator-tier1@sha256:9d5483243918937be4f2178f74cf7c622a531dee41e3176906994d52fa14950a
      n-attempts: 1
      n-concurrent: 1
      timeout-minutes: 300
      environment: skillevaluator
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
