# Generated by SkillEvaluator all-tier CI onboarding.
# Pin only a reviewed commit that stays reachable from main, such as the
# workflow_ref of a committed release descriptor. A pull-request branch commit
# disappears after its squash merge and GitHub then rejects the called workflow.
name: Skill checks (all tiers)
'on':
  pull_request:
    paths:
    - skills/**
    - .github/workflows/skill-checks-all-tiers.yml
    - .github/workflows/skill-feedback-all-tiers.yml
  push:
    branches:
    - main
    paths:
    - skills/**
    - .github/workflows/skill-checks-all-tiers.yml
    - .github/workflows/skill-feedback-all-tiers.yml
  workflow_dispatch: null
permissions:
  contents: read
  id-token: write
  pull-requests: read
  actions: read
jobs:
  skills:
    uses: NVIDIA/SkillEvaluator/.github/workflows/evaluate-all-tiers.yml@fd6852ddc945c49d003a0898edef4933184d8fb3
    with:
      tiers: 1,2,3
      paths: skills
      min-score: 70
      scan-mode: auto
      env-mode: docker
      provider: nv_build
      embedding-provider: nv_build
      model: nvidia/nemotron-3.5-lightning-30b-a3b
      embedding-model: nvidia/nemotron-3.5-embed-1b
      agents: codex,claude-code
      runner: ubuntu-24.04
      tools-repository: NVIDIA/SkillEvaluator
      tools-ref: fd6852ddc945c49d003a0898edef4933184d8fb3
      tier2-image: ghcr.io/nvidia/skillevaluator-tier2@sha256:f191ef1c14a961f01d6ebbac8e3d5ea0fda3b967e604fd14e66bb9f31458a632
      image: ghcr.io/nvidia/skillevaluator-tier1@sha256:e96e3aaad89bf78c4f3f8c621e88005d18bd7c485b29c0d7945864700e5944e6
      n-attempts: 1
      n-concurrent: 1
      timeout-minutes: 300
      environment: skillevaluator
      environment-deployment: false
      tier1-llm: true
      tier1-provider: nv_build
      tier1-model: nvidia/nemotron-3.5-super-vl-120b-a12b
      tier3-provider: openai-compatible
      tier3-model: us/aws/anthropic/eccn-claude-opus-4-8
      tier3-base-url: ${{ vars.SKILL_EVAL_TIER3_BASE_URL }}
      agent-models: |-
        codex=openai/openai/eccn-gpt-6.1-sol
        claude-code=aws/anthropic/eccn-claude-opus-5-5
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      LLM_API_KEY: ${{ secrets[vars.SKILL_EVAL_GATEWAY_SECRET] }}
