# SkillEvaluator release: v1.0.1
# Generated by ci/stable_channel.py.
name: Stable Tier 1 skill checks
on:
  workflow_call:
    inputs:
      paths:
        type: string
        default: skills
      min-score:
        type: number
        default: 70
      scan-mode:
        type: string
        default: auto
      enforcement-mode:
        type: string
        default: strict
      scan-workers:
        type: number
        default: 4
      security-baselines:
        type: boolean
        default: false
      llm:
        type: boolean
        default: false
      llm-provider:
        type: string
        default: openai
      llm-model:
        type: string
        default: ''
      report-base-url:
        type: string
        default: ''
    secrets:
      LLM_API_KEY:
        required: false

# Inherit the caller's permissions. Signed receipts require id-token: write.
jobs:
  tier1:
    name: Tier 1 scan
    uses: NVIDIA/SkillEvaluator/.github/workflows/evaluate-skills.yml@c9369a7811bde083b550f2ac488222e8c388d7fd
    with:
      image: ghcr.io/nvidia/skillevaluator-tier1@sha256:fbff256df8f760019539d442b7cb533d7ec50efab37f4482b7b670e2e4b4189a
      artifact-name: skill-evaluator-tier1
      paths: ${{ inputs.paths }}
      min-score: ${{ inputs.min-score }}
      scan-mode: ${{ inputs.scan-mode }}
      enforcement-mode: ${{ inputs.enforcement-mode }}
      scan-workers: ${{ inputs.scan-workers }}
      security-baselines: ${{ inputs.security-baselines }}
      llm: ${{ inputs.llm }}
      llm-provider: ${{ inputs.llm-provider }}
      llm-model: ${{ inputs.llm-model }}
      report-base-url: ${{ inputs.report-base-url }}
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
