# SPDX-License-Identifier: Apache-2.0
# SkillEvaluator release: v1.2.1
# Generated by ci/stable_channel.py.
name: Stable Tier 1 skill checks
on:
  workflow_call:
    inputs:
      paths:
        type: string
        default: skills
      min-score:
        type: number
        default: 70
      scan-mode:
        type: string
        default: auto
      enforcement-mode:
        type: string
        default: strict
      scan-workers:
        type: number
        default: 4
      security-baselines:
        type: boolean
        default: false
      llm:
        type: boolean
        default: false
      llm-provider:
        type: string
        default: openai
      llm-model:
        type: string
        default: ''
      report-base-url:
        type: string
        default: ''
    secrets:
      LLM_API_KEY:
        required: false

# Inherit the caller's permissions. Signed receipts require id-token: write.
jobs:
  tier1:
    name: Tier 1 scan
    uses: NVIDIA/SkillEvaluator/.github/workflows/evaluate-skills.yml@fd6852ddc945c49d003a0898edef4933184d8fb3
    with:
      image: ghcr.io/nvidia/skillevaluator-tier1@sha256:459f7ab610d3c8a5afff5a3a602ae432fb5644e65a7e3c9a9ca9f89cff723399
      artifact-name: skill-evaluator-tier1
      paths: ${{ inputs.paths }}
      min-score: ${{ inputs.min-score }}
      scan-mode: ${{ inputs.scan-mode }}
      enforcement-mode: ${{ inputs.enforcement-mode }}
      scan-workers: ${{ inputs.scan-workers }}
      security-baselines: ${{ inputs.security-baselines }}
      llm: ${{ inputs.llm }}
      llm-provider: ${{ inputs.llm-provider }}
      llm-model: ${{ inputs.llm-model }}
      report-base-url: ${{ inputs.report-base-url }}
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
