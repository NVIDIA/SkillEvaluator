name: One-time SonarQube fix diagnostics

on:
  push:
    branches:
      - fix/christopherk/sonar-path-validation

permissions:
  contents: read

env:
  SONAR_PROJECT_KEY: NBUSW_Enterprise-AI-Automation_Skill-Evaluator_SkillEvaluator
  SONAR_BRANCH: fix/christopherk/sonar-path-validation

jobs:
  diagnostics:
    name: Read fix-branch findings
    runs-on: [self-hosted, macOS, ARM64, sonar-fix-diagnostics]
    steps:
      - name: Read sanitized SonarQube results
        env:
          RAW_SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          RAW_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3.12 - <<'PY'
          import base64
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          host = os.environ["RAW_SONAR_HOST_URL"].strip().rstrip("/")
          token = os.environ["RAW_SONAR_TOKEN"].strip()
          project = os.environ["SONAR_PROJECT_KEY"]
          branch = os.environ["SONAR_BRANCH"]
          if not host.startswith("https://") or not token:
              raise SystemExit("Valid SonarQube credentials are required")

          authorization = base64.b64encode(f"{token}:".encode()).decode()

          def get(path, **params):
              url = f"{host}{path}?{urlencode(params)}"
              request = Request(
                  url,
                  headers={"Authorization": f"Basic {authorization}"},
              )
              with urlopen(request, timeout=60) as response:
                  return json.load(response)

          quality_gate = get(
              "/api/qualitygates/project_status",
              projectKey=project,
              branch=branch,
          )["projectStatus"]
          print("QUALITY_GATE")
          print(json.dumps({
              "status": quality_gate["status"],
              "failed_conditions": [
                  {
                      "metric": condition["metricKey"],
                      "actual": condition.get("actualValue"),
                      "threshold": condition.get("errorThreshold"),
                  }
                  for condition in quality_gate["conditions"]
                  if condition["status"] == "ERROR"
              ],
          }, indent=2, sort_keys=True))

          issues = get(
              "/api/issues/search",
              componentKeys=project,
              branch=branch,
              resolved="false",
              ps=500,
          )["issues"]
          print("OPEN_ISSUES")
          print(json.dumps([
              {
                  "component": issue.get("component", "").split(":", 1)[-1],
                  "impacts": issue.get("impacts", []),
                  "line": issue.get("line"),
                  "message": issue.get("message"),
                  "rule": issue.get("rule"),
                  "severity": issue.get("severity"),
                  "status": issue.get("status"),
                  "type": issue.get("type"),
              }
              for issue in issues
          ], indent=2, sort_keys=True))
          PY
