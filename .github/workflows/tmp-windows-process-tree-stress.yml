name: Temporary Windows process-tree stress

# Temporary. This repeats the Windows process-tree tests to catch an
# intermittent "process-tree cleanup could not be confirmed" failure with the
# reason in the message. It runs only on a pull request that changes this file,
# and it is removed before that pull request is ready for review.

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-windows-process-tree-stress.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  stress:
    name: Process-tree stress (${{ matrix.mode }} ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [file, full]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.13.8"
      - run: uv sync --all-extras --locked
      - name: Repeat the Windows tests
        shell: bash
        env:
          STRESS_MODE: ${{ matrix.mode }}
        run: |
          set -uo pipefail
          if [ "$STRESS_MODE" = "file" ]; then
            iterations=14
            command="uv run pytest -q -n auto -p no:cacheprovider tests/test_harbor_runner_status.py"
          else
            iterations=3
            # The exact command of the Tier 2 (windows-latest) job, read from ci.yml.
            command="$(uv run python -c "import yaml; job = yaml.safe_load(open('.github/workflows/ci.yml', encoding='utf-8'))['jobs']['tier2-windows']; print(' '.join(job['steps'][-1]['run'].split()))")"
          fi
          echo "command: $command"
          failed=0
          for iteration in $(seq 1 "$iterations"); do
            echo "=== iteration $iteration of $iterations ==="
            if ! $command; then
              failed=$((failed + 1))
              echo "=== iteration $iteration FAILED ==="
            fi
          done
          echo "failed iterations: $failed of $iterations"
          test "$failed" -eq 0
