title = "SkillEvaluator Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic OpenAI token used by Tier 3 redaction tests"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ['''^sk-AbCdEf1234567890$''']
paths = ['''^tests/test_tier3_(progress|result_display)\.py$''']

[[allowlists]]
description = "Synthetic policy key used by NeMo Gym rollout redaction tests"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ['''^gw-policy-0a1b2c3d4e5f6789$''']
paths = ['''^tests/test_nemo_gym_backend\.py$''']

[[allowlists]]
description = "Synthetic curl basic-auth credential used by judge evidence redaction tests"
condition = "AND"
targetRules = ["curl-auth-user"]
regexes = ['''^["']admin:quoted-user-password["']$''']
paths = ['''^tests/tier3/test_judge_contracts\.py$''']

[[allowlists]]
description = "Synthetic JSON-escaped-quote curl credential placeholder used by judge evidence redaction tests"
condition = "AND"
targetRules = ["curl-auth-user"]
regexes = ['''^"admin:\{_QUOTED_SECRET\}"$''']
paths = ['''^tests/tier3/test_judge_contracts\.py$''']

[[allowlists]]
description = "Synthetic NVIDIA Build token used by streaming redaction tests"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ['''^Ab1Cd2Ef3Gh4Ij5Kl6Mn7Op8$''']
paths = ['''^tests/test_harbor_local_mode\.py$''']

[[allowlists]]
description = "Synthetic main-container values used by Docker isolation tests"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ['''^main-(persistent|task|scoped)-secret-[0-9]{5}$''']
paths = ['''^tests/test_harbor_secure_docker_environment\.py$''']

[[allowlists]]
description = "Synthetic cwsandbox API key used by Harbor environment contract tests"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ['''^cw-key-123456$''']
paths = ['''^tests/test_harbor_environment_contract\.py$''']

[[allowlists]]
description = "Bedrock model ID that follows a credential name in SkillSpector bridge tests"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ['''^us\.anthropic\.claude-opus-5$''']
paths = ['''^tests/validators/test_security\.py$''']

[[allowlists]]
description = "Bedrock model ID in the merge-leftover SkillSpector bridge test copy from commit e8aa35d6a"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ['''^us\.anthropic\.claude-opus-5$''']
paths = ['''^tests/validators/test_security\.py\.orig$''']

[[allowlists]]
description = "Synthetic HTTP hook credential used by static risk tests"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ["^abcd1234secret$"]
paths = ["^tests/validators/test_plugin_component_risk[.]py$"]

[[allowlists]]
description = "Synthetic MCP header value used by private runtime credential rejection tests"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ['''^0123456789abcdef0123456789abcdef$''']
paths = ['''^tests/tier3/test_(private_runtime_regressions|native_mcp_policy)\.py$''']

[[allowlists]]
description = "Synthetic curl basic-auth credential used by grader reason redaction tests"
condition = "AND"
targetRules = ["curl-auth-user"]
regexes = ['''^admin:hunter2hunter2$''']
paths = ['''^tests/reporting/test_tier3_failure_reasons\.py$''']
