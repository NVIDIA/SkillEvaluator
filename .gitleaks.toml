title = "SkillEvaluator Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic OpenAI token used by Tier 3 redaction tests"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ['''^sk-AbCdEf1234567890$''']
paths = ['''^tests/test_tier3_(progress|result_display)\.py$''']

[[allowlists]]
description = "Synthetic JWT and private-key fixtures in the first revision of the redaction tests (PR #172); the file now assembles them from split literals"
condition = "AND"
commits = ["97a0616f7786fc5b10c49aa24b0a55f8d446bcab"]
paths = ['''^tests/test_redaction_assignments\.py$''']
