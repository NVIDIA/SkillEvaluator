title = "SkillEvaluator Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic OpenAI token used by Tier 3 redaction tests"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ['''^sk-AbCdEf1234567890$''']
paths = ['''^tests/test_tier3_(progress|result_display)\.py$''']

[[allowlists]]
description = "Synthetic API key used by plugin hook inline-secret tests"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ['''^abcd1234secret$''']
paths = ['''^tests/validators/test_plugin_component_risk\.py$''']

[[allowlists]]
description = "Synthetic Docker registry login (base64 of a fake user:password) used by the scanner-credential tests"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ['''^dXNlcjpodW50ZXIy$''']
paths = ['''^tests/validators/test_audits_endpoints_review_fixes\.py$''']

[[allowlists]]
description = "Synthetic basic-auth, cloud-key and URL-token fixtures in the first revisions of the security-evidence and MCP-hardening tests; both files now assemble them from split literals"
condition = "AND"
commits = ["66ae1d4c1188e2a8d9f0586abe0a895e04b78758", "727826808a2d4c3c2b7c393d67f5339efde28532"]
paths = ['''^tests/tier3/test_security_finding_evidence\.py$''', '''^tests/validators/test_mcp_hardening\.py$''']

[[allowlists]]
description = "Synthetic NVIDIA Build token used by streaming redaction tests"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ['''^Ab1Cd2Ef3Gh4Ij5Kl6Mn7Op8$''']
paths = ['''^tests/test_harbor_local_mode\.py$''']

[[allowlists]]
description = "Synthetic main-container values used by Docker isolation tests"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ['''^main-(persistent|task|scoped)-secret-[0-9]{5}$''']
paths = ['''^tests/test_harbor_secure_docker_environment\.py$''']

[[allowlists]]
description = "Synthetic JWT in the first revision of the hook-census label-window test; the test now assembles it from its parts"
condition = "AND"
targetRules = ["jwt"]
commits = ["6dab46f91eb7323b27d0e90ecb7c90f5c38e7da4"]
paths = ['''^tests/tier3/test_hook_census\.py$''']

[[allowlists]]
description = "Synthetic deploy token in the first revision of the MCP bundle userinfo test; the test now splits it"
condition = "AND"
targetRules = ["generic-api-key"]
commits = ["79a8fc2eb731bb155bb6b725e3655790eae2fa02"]
paths = ['''^tests/validators/test_plugin_components\.py$''']

[[allowlists]]
description = "Synthetic OpenSSH private-key fixtures in the first revision of the report-text redaction tests; the tests now assemble the PEM label"
condition = "AND"
targetRules = ["private-key"]
commits = ["2c5afed9274221fb8a408eeee0601ad53bad9090"]
paths = ['''^tests/validators/test_url_policy\.py$''']
