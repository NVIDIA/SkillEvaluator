# Merge this into an existing .gitlab-ci.yml or use it as the complete file.
# The release-generated copy pins both the reusable job and its container image.
include:
  - remote: https://raw.githubusercontent.com/NVIDIA/SkillEvaluator/e4cda13a85f34fa7a112b3529feaf24cfe587caf/ci/gitlab/skill-evaluation.yml

variables:
  SKILL_EVAL_IMAGE: ghcr.io/nvidia/skillevaluator-tier1@sha256:c75c826f0e52d6c9a8d303ad7eefd606ed86e6940123f42b4eda2457863bcee7
  SKILL_EVAL_PATHS: "skills"
  SKILL_EVAL_MIN_SCORE: "70"

# GitLab requires merge-request rules directly in the root file, even when a
# job is included. Preserve your existing workflow rules if you have them.
skill-evaluation:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
