# Merge this into an existing .gitlab-ci.yml or use it as the complete file.
# The release-generated copy pins both the reusable job and its container image.
include:
  - remote: https://raw.githubusercontent.com/NVIDIA/SkillEvaluator/46a8cf269257d1ec56a0285c508ac9ee48010930/ci/gitlab/skill-evaluation.yml

variables:
  SKILL_EVAL_IMAGE: ghcr.io/nvidia/skillevaluator-tier1@sha256:a3baec51f48145cdf9de05a5ab054d9576f62f1de0f5276b788410f5c17747d4
  SKILL_EVAL_PATHS: "skills"
  SKILL_EVAL_MIN_SCORE: "70"

# GitLab requires merge-request rules directly in the root file, even when a
# job is included. Preserve your existing workflow rules if you have them.
skill-evaluation:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
