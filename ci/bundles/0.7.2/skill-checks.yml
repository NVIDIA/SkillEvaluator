name: Skill checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  # Hosted reports/PR comments: uncomment this, then refresh trusted-caller-blobs.
  # id-token: write
jobs:
  skills:
    uses: NVIDIA/SkillEvaluator/.github/workflows/evaluate-skills.yml@46a8cf269257d1ec56a0285c508ac9ee48010930
    with:
      image: ghcr.io/nvidia/skillevaluator-tier1@sha256:a3baec51f48145cdf9de05a5ab054d9576f62f1de0f5276b788410f5c17747d4
      paths: skills
      min-score: 70
      scan-mode: auto
      llm: false
