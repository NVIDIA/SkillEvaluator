# SPDX-License-Identifier: Apache-2.0
# Optional trusted manual run; the basic skill-checks.yml needs no model secret.
# Use the release-generated copy with reviewed workflow and image pins.
# The image uses the same default OSS policy for public and private repositories.
# LLM content sharing is controlled by llm and the selected provider, not a profile.
name: Skill checks with LLM
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skills:
    uses: NVIDIA/SkillEvaluator/.github/workflows/evaluate-skills.yml@55d2d046595e61cce6ba9f5fd9cc84b972cd3915
    with:
      image: ghcr.io/nvidia/skillevaluator-tier1@sha256:9d5483243918937be4f2178f74cf7c622a531dee41e3176906994d52fa14950a
      paths: skills
      min-score: 70
      scan-mode: all
      llm: true
      llm-provider: openai
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
