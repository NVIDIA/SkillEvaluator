# Use the release-generated copy with reviewed workflow and image pins.
# The image uses the default OSS validation policy for public and private repos.
# No internal/external input is needed; report visibility is configured separately.
name: Skill checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  # Hosted reports/PR comments: uncomment this, then refresh trusted-caller-blobs.
  # id-token: write
jobs:
  skills:
    uses: NVIDIA/SkillEvaluator/.github/workflows/evaluate-skills.yml@55d2d046595e61cce6ba9f5fd9cc84b972cd3915
    with:
      image: ghcr.io/nvidia/skillevaluator-tier1@sha256:9d5483243918937be4f2178f74cf7c622a531dee41e3176906994d52fa14950a
      paths: skills
      min-score: 70
      scan-mode: auto
      llm: false
