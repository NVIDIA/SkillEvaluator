# SPDX-License-Identifier: Apache-2.0
# Optional trusted manual run; the basic skill-checks.yml needs no model secret.
# Use the release-generated copy with reviewed workflow and image pins.
# The image uses the same default OSS policy for public and private repositories.
# LLM content sharing is controlled by llm and the selected provider, not a profile.
name: Skill checks with LLM
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skills:
    uses: NVIDIA/SkillEvaluator/.github/workflows/evaluate-skills.yml@75949f7d1bb1222850edf1ea9621a89ae3fb9bb7
    with:
      image: ghcr.io/nvidia/skillevaluator-tier1@sha256:39c381bc9559be4fe30ede2b937d1a8577fcfedc66230a8e52b6fe5e79c23c94
      paths: skills
      min-score: 70
      security-baselines: false
      scan-mode: all
      llm: true
      llm-provider: openai
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
