# SPDX-License-Identifier: Apache-2.0
# Optional trusted manual run; the basic skill-checks.yml needs no model secret.
# Use the release-generated copy with reviewed workflow and image pins.
# The image uses the same default OSS policy for public and private repositories.
# LLM content sharing is controlled by llm and the selected provider, not a profile.
name: Skill checks with LLM
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skills:
    uses: NVIDIA/SkillEvaluator/.github/workflows/evaluate-skills.yml@fd6852ddc945c49d003a0898edef4933184d8fb3
    with:
      image: ghcr.io/nvidia/skillevaluator-tier1@sha256:459f7ab610d3c8a5afff5a3a602ae432fb5644e65a7e3c9a9ca9f89cff723399
      paths: skills
      min-score: 70
      security-baselines: false
      scan-mode: all
      llm: true
      llm-provider: openai
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
