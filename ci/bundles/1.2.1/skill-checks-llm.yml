# SPDX-License-Identifier: Apache-2.0
# Optional trusted manual run; the basic skill-checks.yml needs no model secret.
# Use the release-generated copy with reviewed workflow and image pins.
# The image uses the same default OSS policy for public and private repositories.
# LLM content sharing is controlled by llm and the selected provider, not a profile.
name: Skill checks with LLM
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skills:
    uses: NVIDIA/SkillEvaluator/.github/workflows/evaluate-skills.yml@e1bcdd00d4dcf43f0986ed6686f7e7f89573f3c6
    with:
      image: ghcr.io/nvidia/skillevaluator-tier1@sha256:c7a63f850211f08ebe40df28033527788b4c53f527b3fff608612a2403b43779
      paths: skills
      min-score: 70
      security-baselines: false
      scan-mode: all
      llm: true
      llm-provider: openai
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
