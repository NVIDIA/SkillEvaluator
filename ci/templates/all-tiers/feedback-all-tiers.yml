# SPDX-License-Identifier: Apache-2.0
# Merge this onto the default branch before expecting automatic PR feedback.
name: Skill feedback (all tiers)
on:
  workflow_run:
    workflows: ['Skill checks (all tiers)']
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  feedback:
    uses: NVIDIA/SkillEvaluator/.github/workflows/feedback-all-tiers.yml@RELEASE_WORKFLOW_SHA
    with:
      tools-repository: NVIDIA/SkillEvaluator
      tools-ref: RELEASE_WORKFLOW_SHA
      trusted-workflow-ref: NVIDIA/SkillEvaluator/.github/workflows/evaluate-all-tiers.yml@RELEASE_WORKFLOW_SHA
      trusted-caller-blobs: REVIEWED_CALLER_GIT_BLOB
  # Optional: generated by ci init --benchmark-pr on GitHub only.
  # Requires immutable pins declaring ci-benchmark-pr-v1.
  # benchmarks:
  #   uses: NVIDIA/SkillEvaluator/.github/workflows/publish-benchmarks.yml@RELEASE_WORKFLOW_SHA
  #   permissions:
  #     contents: write
  #     actions: read
  #     pull-requests: write
