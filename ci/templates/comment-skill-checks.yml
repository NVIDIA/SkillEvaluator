# SPDX-License-Identifier: Apache-2.0
# Optional standard PR feedback without hosted reports or Pages configuration.
# Use reviewed release pins that include the comment-skill-checks workflow.
# Grant id-token: write in skill-checks.yml, then approve its exact Git blob below.
name: Comment skill checks
on:
  workflow_run:
    workflows: [Skill checks]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: Completed Skill checks run to comment on
        type: string
        required: true
      run-attempt:
        description: Completed attempt number for that run
        type: string
        required: true
permissions: {}
jobs:
  comment:
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: NVIDIA/SkillEvaluator/.github/workflows/comment-skill-checks.yml@RELEASE_WORKFLOW_SHA
    with:
      run-id: ${{ format('{0}', github.event.workflow_run.id || inputs.run-id) }}
      run-attempt: ${{ format('{0}', github.event.workflow_run.run_attempt || inputs.run-attempt) }}
      trusted-evaluator-shas: RELEASE_WORKFLOW_SHA
      trusted-caller-blobs: YOUR_APPROVED_CALLER_BLOB
      # Shared wrappers use the same approvals as the hosted publisher.
      # trusted-wrapper-workflows: your-org/shared-ci/.github/workflows/skill-checks.yml@FULL_COMMIT_SHA
      # To delegate evaluator pin selection to one reviewed shared wrapper:
      # trusted-wrapper-workflows: your-org/shared-ci/.github/workflows/skill-checks.yml@v3
      # delegated-evaluator-wrapper: your-org/shared-ci/.github/workflows/skill-checks.yml@v3
      # Omit trusted-evaluator-shas when delegating; caller blob approval stays required.
      tools-ref: RELEASE_WORKFLOW_SHA
      tools-repository: NVIDIA/SkillEvaluator
