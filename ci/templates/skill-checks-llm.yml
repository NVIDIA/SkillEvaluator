# SPDX-License-Identifier: Apache-2.0
# Optional trusted manual run; the basic skill-checks.yml needs no model secret.
# Use the release-generated copy with reviewed workflow and image pins.
name: Skill checks with LLM
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skills:
    uses: NVIDIA/SkillEvaluator/.github/workflows/evaluate-skills.yml@RELEASE_WORKFLOW_SHA
    with:
      image: ghcr.io/nvidia/skillevaluator-tier1@sha256:RELEASE_IMAGE_DIGEST
      paths: skills
      scan-mode: all
      llm: true
      llm-provider: openai
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
