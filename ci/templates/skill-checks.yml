# SPDX-License-Identifier: Apache-2.0
# Use the release-generated copy with reviewed workflow and image pins.
# The image uses the default OSS validation policy for public and private repos.
# No internal/external input is needed; report visibility is configured separately.
name: Skill checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  # PR comments or hosted reports: uncomment this, then refresh trusted-caller-blobs.
  # id-token: write
jobs:
  skills:
    uses: NVIDIA/SkillEvaluator/.github/workflows/evaluate-skills.yml@RELEASE_WORKFLOW_SHA
    with:
      image: ghcr.io/nvidia/skillevaluator-tier1@sha256:RELEASE_IMAGE_DIGEST
      paths: skills
      min-score: 70
      # Enable only after the reviewed baseline manifest reaches the target branch.
      security-baselines: false
      scan-mode: auto
      llm: false
