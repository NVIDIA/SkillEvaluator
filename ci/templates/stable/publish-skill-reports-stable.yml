# SPDX-License-Identifier: Apache-2.0
# SkillEvaluator release: RELEASE_TAG
# Generated by ci/stable_channel.py.
name: Stable hosted skill reports
on:
  workflow_call:
    inputs:
      run-id:
        type: string
        required: true
      run-attempt:
        type: string
        required: true
      report-base-url:
        type: string
        required: true
      trusted-caller-blobs:
        type: string
        required: true
      retention-runs:
        type: number
        default: 100

# Match the scopes required by the pinned publisher. The consumer grants these in its caller.
permissions:
  actions: read
  contents: write
  id-token: write
  pages: write
  pull-requests: write

jobs:
  publish:
    uses: NVIDIA/SkillEvaluator/.github/workflows/publish-skill-reports.yml@RELEASE_PUBLISHER_SHA
    with:
      tools-ref: RELEASE_PUBLISHER_SHA
      run-id: ${{ inputs.run-id }}
      run-attempt: ${{ inputs.run-attempt }}
      report-base-url: ${{ inputs.report-base-url }}
      retention-runs: ${{ inputs.retention-runs }}
      trusted-caller-blobs: ${{ inputs.trusted-caller-blobs }}
      trusted-wrapper-workflows: NVIDIA/SkillEvaluator/.github/workflows/skill-checks-stable.yml@stable
      delegated-evaluator-wrapper: NVIDIA/SkillEvaluator/.github/workflows/skill-checks-stable.yml@stable
