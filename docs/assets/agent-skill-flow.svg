<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 292" width="880" height="292" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">How the SkillEvaluator agent skill works</title>
  <desc id="flow-desc">You ask your agent in plain language, the SkillEvaluator skill picks the check, the skillevaluator CLI runs it on your machine, and you get a verdict, scores and what to fix.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="50%" stop-color="#101812"/><stop offset="100%" stop-color="#0d1117"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a261c"/><stop offset="100%" stop-color="#121a14"/></linearGradient>
    <linearGradient id="outCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#243528"/><stop offset="100%" stop-color="#162016"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#76b900"/><stop offset="100%" stop-color="#76b900" stop-opacity="0.15"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1.2 1.2 L8.5 5 L1.2 8.8" fill="none" stroke="#6f9264" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="880" height="292" rx="24" fill="url(#bg)" stroke="#273129" stroke-width="1"/>
  <circle cx="230" cy="170" r="105" fill="#76b900" fill-opacity="0.045"/>
  <circle cx="680" cy="150" r="120" fill="#9bdb34" fill-opacity="0.04"/>
  <text x="36" y="38" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.6" fill="#6f9264">FROM YOUR AGENT</text>
  <text x="36" y="62" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.3" fill="#f0f4ee">Ask once. The skill does the rest.</text>
  <g transform="translate(36 88)">
  <rect width="181" height="172" rx="16" fill="url(#card)" stroke="#304631" stroke-width="1"/>
  <rect x="0" y="0" width="181" height="3" rx="1.5" fill="url(#accent)"/>
  <g transform="translate(16 20) scale(0.75)" fill="none" stroke="#76b900" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9h30a5 5 0 0 1 5 5v17a5 5 0 0 1-5 5H23l-9 7v-7H9a5 5 0 0 1-5-5V14a5 5 0 0 1 5-5z"/><path d="M15 19h18M15 26h11"/></g>
  <text x="165" y="52" text-anchor="end" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#2c4432">1</text>
  <text x="16" y="88" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3f7f0">You ask</text>
  <text x="16" y="108" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9bdb34">In plain language</text>
  <line x1="16" y1="120" x2="165" y2="120" stroke="#304631" stroke-width="1"/>
  <text x="16" y="141" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#dbe8d6">“Is my skill any good?”</text>
  </g>
  <line x1="222" y1="174.0" x2="239" y2="174.0" stroke="#6f9264" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g transform="translate(245 88)">
  <rect width="181" height="172" rx="16" fill="url(#card)" stroke="#304631" stroke-width="1"/>
  <rect x="0" y="0" width="181" height="3" rx="1.5" fill="url(#accent)"/>
  <g transform="translate(16 20) scale(0.75)" fill="none" stroke="#76b900" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5h16l8 8v27a3 3 0 0 1-3 3H13a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z"/><path d="M29 5v8h8"/><path d="m23.500 19 1.900 5.100 5.100 1.900-5.100 1.900-1.900 5.100-1.900-5.100-5.100-1.900 5.100-1.900z" fill="#76b900" stroke="none"/></g>
  <text x="165" y="52" text-anchor="end" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#2c4432">2</text>
  <text x="16" y="88" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3f7f0">The skill decides</text>
  <text x="16" y="108" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9bdb34">Tier 1, 2 or 3</text>
  <line x1="16" y1="120" x2="165" y2="120" stroke="#304631" stroke-width="1"/>
  <text x="16" y="141" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a9b9a2">Picks the command</text>
  <text x="16" y="159" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a9b9a2">and the right flags</text>
  </g>
  <line x1="431" y1="174.0" x2="448" y2="174.0" stroke="#6f9264" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g transform="translate(454 88)">
  <rect width="181" height="172" rx="16" fill="url(#card)" stroke="#304631" stroke-width="1"/>
  <rect x="0" y="0" width="181" height="3" rx="1.5" fill="url(#accent)"/>
  <g transform="translate(16 20) scale(0.75)" fill="none" stroke="#76b900" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="9" width="38" height="30" rx="5"/><path d="m13 19 6 5-6 5"/><path d="M23 30h10"/></g>
  <text x="165" y="52" text-anchor="end" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#2c4432">3</text>
  <text x="16" y="88" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3f7f0">The CLI runs it</text>
  <text x="16" y="108" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9bdb34">On your machine</text>
  <line x1="16" y1="120" x2="165" y2="120" stroke="#304631" stroke-width="1"/>
  <text x="16" y="141" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#b9d1ae">skillevaluator tier1</text>
  <text x="16" y="159" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#b9d1ae">./my-skill --no-llm</text>
  </g>
  <line x1="640" y1="174.0" x2="657" y2="174.0" stroke="#6f9264" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g transform="translate(663 88)">
  <rect width="181" height="172" rx="16" fill="url(#outCard)" stroke="#304631" stroke-width="1"/>
  <rect x="0" y="0" width="181" height="3" rx="1.5" fill="url(#accent)"/>
  <g transform="translate(16 20) scale(0.75)" fill="none" stroke="#76b900" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5h24a3 3 0 0 1 3 3v32a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z"/><path d="m16 17 3 3 5-6"/><path d="M28 18h5M16 28h17M16 35h11"/></g>
  <text x="165" y="52" text-anchor="end" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#2c4432">4</text>
  <text x="16" y="88" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3f7f0">You get the answer</text>
  <text x="16" y="108" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9bdb34">From real evidence</text>
  <line x1="16" y1="120" x2="165" y2="120" stroke="#304631" stroke-width="1"/>
  <text x="16" y="141" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a9b9a2">Verdict, scores and</text>
  <text x="16" y="159" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a9b9a2">what to fix first</text>
  </g>
</svg>
