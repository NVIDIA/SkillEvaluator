# SkillEvaluator default validation policy
#
# Shared by public and private repositories. This policy governs finding
# severity and author validation, not repository visibility or report hosting.
# The CLI accepts "external" as a compatibility alias for this same policy.

profile: default

identity:
  # Disable domain restriction. The author shape (Name <email@host>) is
  # still validated by the schema validator, independent of this regex.
  author_email_regex: null

severity_overrides:
  # Schema / repository governance
  SCHEMA.author_missing: high
  SCHEMA.author_format: high

  # Workflows
  WORKFLOWS.author_format: high

  # License issues block publication.
  LICENSE.*: critical
