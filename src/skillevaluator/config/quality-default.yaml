# Default deterministic quality-check configuration.
#
# The word lists below are the union of English, Russian and Chinese terms, so a
# well-formed skill written in one of those languages is not penalised for lacking
# English wording. No language detection takes place: every list applies to every
# skill. A custom --quality-config file may replace any list, for example to add
# another language or to keep only one.
expected_headers:
  - heading: "## Prerequisites"
    alternatives:
      - "## Requirements"
      - "## Предварительные условия"
      - "## Требования"
      - "## 前提条件"
      - "## 先决条件"
    points: 5
    message: "No prerequisites/requirements documented"
    suggestion: "Document dependencies, API keys, or setup needed"
  - heading: "## Limitations"
    alternatives:
      - "## Ограничения"
      - "## 限制"
    points: 5
    message: "No limitations documented"
    suggestion: "Add '## Limitations' section with known issues/constraints"
  - heading: "## Troubleshooting"
    alternatives:
      - "## Common Issues"
      - "## FAQ"
      - "## Устранение неполадок"
      - "## Решение проблем"
      - "## 故障排除"
      - "## 疑难解答"
    points: 5
    message: "No troubleshooting section documented"
    suggestion: "Add '## Troubleshooting' with Error/Cause/Solution patterns"

# Reliability error-handling rules. A custom file may set any subset of these;
# omitted blocks and keys keep the values below. Set points to 0 to turn a rule off.
error_handling:
  # SKILL.md mentions none of the terms (whole word, any case). A term written in a script
  # without spaces between words, such as Chinese, matches anywhere in the text.
  mentioned:
    points: 10
    message: "No mention of error handling or validation"
    suggestion: "Document expected errors and how to handle them"
    terms: [error, errors, exception, exceptions, invalid, fail, fails, failed, failure, failures, failing,
            validate, validates, validated, validating, validation, validations,
            ошибка, ошибки, ошибок, ошибочно, исключение, невалидный, сбой, сбои, не удалось,
            валидация, валидирует, не найден, недоступен,
            错误, 异常, 失败, 无效, 验证, 校验]
  # A script has neither try/except nor any marker (case-sensitive substring).
  scripts:
    points: 5
    message: "Scripts may lack error handling"
    suggestion: "Scripts should handle errors explicitly"
    markers: ["if not ", "if error", "raise", "assert", "ValueError", "FileNotFoundError"]
  # A lib module has neither try/except nor any marker (case-sensitive substring).
  lib:
    points: 5
    message: "Lib modules may lack error handling"
    suggestion: "Library code should handle errors explicitly with try/except or raise"
    markers: ["raise", "assert", "ValueError", "TypeError", "RuntimeError"]

# Efficiency rules. They overlay the same way as error_handling: a custom file may set any
# subset, omitted keys keep the values below, and points: 0 turns a rule off.
efficiency:
  # SKILL.md is estimated at more than max_tokens tokens (characters divided by 4, frontmatter
  # included). The finding appends the estimate and the limit to the message. Keep the message
  # short: report summaries cut a finding message at 160 characters.
  token_budget:
    points: 15
    message: "Large skill"
    suggestion: "Per agentskills.io, SKILL.md should be concise (~500 lines) — large skill bodies increase token cost after invocation; long or unfocused top-level descriptions can degrade agent routing accuracy. Keep required sections concise; move detailed examples, reference material, and supporting docs to the references/ directory"
    max_tokens: 5000
  # The "## Instructions" or "## Usage" section contains none of the terms (whole word, any case).
  # A skill without either section is not checked.
  action_verbs:
    points: 15
    message: "Instructions lack clear action verbs"
    suggestion: "Use imperative: 'Use run_script with...', 'Call activate_skill...'"
    terms: [use, call, run, execute, pass, set, add, mark, update, keep,
            используй, используйте, вызови, вызовите, запусти, запустите, выполни, выполните,
            передай, передайте, установи, установите, добавь, добавьте, обнови, обновите,
            使用, 调用, 运行, 执行, 传入, 设置, 添加, 标记, 更新, 保留]
  # SKILL.md contains one of the terms (whole word, any case).
  buzzwords:
    points: 5
    message: "Uses complex/corporate language"
    suggestion: "Use simple, direct language: 'use' not 'utilize'"
    terms: [utilize, facilitate, leverage, paradigm, synergy]

# Discoverability rules. They overlay the same way as error_handling and efficiency.
discoverability:
  # The frontmatter description, with surrounding whitespace removed, has fewer than min_chars
  # characters. A skill without a description key, or with an empty one, is not checked here; a
  # key left without a value is read as null and counted as the 4-character text "None". The
  # finding appends the length and the minimum to the message.
  description_too_short:
    points: 20
    message: "Description too short (recommend 50-150 chars)"
    suggestion: "Add more context: what tasks does this skill handle?"
    min_chars: 20
  # The description, with surrounding whitespace removed, has more than max_chars characters.
  # The finding appends the length and the maximum to the message.
  description_too_long:
    points: 5
    message: "Description very long (recommend 50-150 chars)"
    suggestion: "Keep descriptions concise for progressive disclosure"
    max_chars: 200
  # The description contains none of the terms (whole word, any case), so it does not say
  # when to use the skill.
  trigger_words:
    points: 10
    message: "Description doesn't mention WHEN to use this skill"
    suggestion: "Add trigger context: 'Use for...', 'When you need to...'"
    terms: [use, when, for, helps, allows,
            используй, используется, применяй, когда, для, помогает, позволяет, служит,
            使用, 用于, 当, 适用于, 帮助, 允许]
  # The description contains one of the terms (whole word, any case).
  vague_words:
    points: 15
    message: "Description contains vague words"
    suggestion: "Be specific about what this skill does"
    terms: [something, things, stuff, various, general,
            что-то, разное, всякое, общее,
            一些, 各种, 东西]
  # The description contains one of the terms (whole word or phrase, any case).
  person_phrases:
    points: 15
    message: "Description uses first/second person"
    suggestion: "Use third person: 'Processes files' not 'I can process'"
    terms: ["i can", "i will", "you can", "you should", your, my, "we can"]
  # A description of more than longer_than characters contains one of the terms and none of
  # the negatives (whole word or phrase, any case).
  broad_description:
    points: 5
    message: "Broad description without negative triggers may cause over-triggering"
    suggestion: "Add boundary phrases like 'Do NOT use for...'"
    terms: [data, files, documents, project, manage, handle, process]
    negatives: ["not for", "do not use", "instead use", "except when", "not when"]
    longer_than: 100
  # SKILL.md contains none of the headings (exact text, anywhere in the file).
  purpose_heading:
    points: 5
    message: "No '## Purpose' section"
    suggestion: "Add purpose section to clarify use cases"
    headings: ["## Purpose", "## Назначение", "## Цель", "## 目的", "## 用途"]

# Correctness rules. They overlay the same way as the sections above.
correctness:
  # The frontmatter name contains one of the terms as a whole word (any case). This is an
  # error-level rule: its finding is HIGH and fails the quality check whatever the score.
  # The finding appends the matched terms to the message. A term may contain only letters,
  # digits and single hyphens, like a skill name. The schema check keeps its own
  # reserved-word list, which this file does not change.
  reserved_name:
    points: 15
    message: "Name contains reserved word"
    suggestion: "Remove reserved words from skill name"
    terms: [anthropic, claude]
  # A resource-based skill's SKILL.md contains none of the terms (whole word, any case).
  resource_docs:
    points: 10
    message: "Resource-based skill lacks documentation of available resources"
    suggestion: "Document available templates, assets, and design resources in SKILL.md"
    terms: [template, asset, design, style, css, html, resource,
            шаблон, шаблоны, ресурс, ресурсы, стиль, стили, дизайн,
            模板, 资源, 样式, 设计]
  # A lib-based skill has resource directories but SKILL.md contains none of the terms
  # (whole word, any case). The finding appends the directory names to the message.
  lib_resource_docs:
    points: 5
    message: "Lib-based skill has resource directories but SKILL.md lacks resource documentation"
    suggestion: "Document the bundled templates, assets, or design resources in SKILL.md"
    terms: [template, asset, design, style, css, html, resource,
            шаблон, шаблоны, ресурс, ресурсы, стиль, стили, дизайн,
            模板, 资源, 样式, 设计]
