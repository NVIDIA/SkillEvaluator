harness: claude-code
display_name: Claude Code
verified: {version: 2.1.316, source: closed (bundled JS inspected), date: 2026-11-01, method: proxy-captured canary probes x3, os: linux}
roots:
  project: [.claude/skills]
  user: [~/.claude/skills]
  not_scanned: [.agents/skills, ~/.agents/skills]
listing: {cut: 1536, text_fact: claude_listing_text, budget: {desc_chars: 8000, chars_per_context_token: 0.04}}
rules:
  - {id: CC-ROOT, when: "install_root not in roots", effect: not_loaded, outcome: not found, message: "Claude Code reads only .claude/skills and ~/.claude/skills; .agents/skills is not scanned.", fix: "Install it under .claude/skills or ~/.claude/skills (a symlink from .agents/skills works).", confidence: high}
  - {id: CC-GROUPING, when: "grouping_depth > 0", effect: not_loaded, outcome: not found, message: "Claude Code finds skills only directly under the skills folder; grouping folders are not searched.", fix: "Move the skill folder directly under .claude/skills.", confidence: high}
  - {id: CC-DESC-CUT, when: "claude_listing_codepoints > 1536", effect: degraded, outcome: listing shortened, message: "Description cut at 1,536 characters ({claude_listing_codepoints} with when_to_use, which Claude Code lists after it).", fix: "Keep description and when_to_use at or under 1,536 characters together.", confidence: high}
  - {id: CC-DOLLAR-N, when: "dollar_literal_count > 0", effect: degraded, outcome: text rewritten, message: "{dollar_literal_count} price-like $N tokens (lines {dollar_literal_lines}) are argument placeholders: invoked with five or more arguments, $4.00 becomes <5th argument>.00 (an unmatched $N is kept verbatim).", fix: "Reword amounts (e.g. USD 4.00); \\$4.00 escapes it here, but other harnesses then show the backslash.", versions: "installed skills; bundled skills skip substitution", confidence: high}
  - {id: CC-DESC-MISSING, when: "description_missing or description_empty or description_type != 'str'", effect: degraded, message: "No usable description: Claude Code shows body text instead.", fix: "Add a non-empty string description.", confidence: high}
  - {id: CC-LIST-BUDGET, when: "catalog_desc_chars > list_budget_chars", effect: degraded, outcome: listing shortened, message: "The {catalog_size} skills in this folder have {catalog_desc_chars} description chars; Claude Code's skill list fits {list_budget_chars} (1% of the context window at 4 chars per token; 8,000 if the window is unknown), so descriptions get shortened.", fix: "Shorten descriptions (trigger first) or install fewer skills here.", confidence: medium}
  - {id: CC-PRECEDENCE, when: "duplicate_name", effect: advisory, message: "Another skill is also named '{skill_name}' ({duplicate_paths}); only one is used, and a user-level copy beats a project copy.", fix: "Give each skill a unique name.", confidence: high}
  - {id: CC-USER-COPY, when: "user_copy", effect: advisory, message: "A skill also named '{skill_name}' is installed at {user_copy_paths}; Claude Code uses that user-level copy, not this one.", fix: "Remove one copy, or give each a unique name.", confidence: high}
  - {id: CC-LOOKALIKE, when: "lookalike_names != ''", effect: advisory, message: "{lookalike_names} in the same folder has a near-identical description, so the model may pick the wrong skill.", fix: "Make each description name what only that skill does.", confidence: medium}
  - {id: CC-ALLOWED-TOOLS, when: "allowed_tools_shape != 'none'", effect: advisory, message: "allowed-tools only pre-approves tools, never restricts, and applies only when the skill is invoked through the Skill tool (e.g. /name), not when the model reads the file. With --headless, see CC-ALLOWED-TOOLS-HEADLESS.", fix: "Don't rely on allowed-tools to restrict tools; use the harness's permission settings.", confidence: high}
  - {id: CC-ALLOWED-TOOLS-HEADLESS, when: "headless and allowed_tools_shape != 'none'", effect: not_loaded, outcome: instructions not delivered, message: "In headless -p runs with default permissions the Skill call for a skill declaring allowed-tools is refused, so the body is not delivered.", fix: "For headless use, drop allowed-tools or allow the Skill tool (e.g. --allowedTools Skill); the declared tools are then pre-approved without a prompt, so allow Skill only in repos whose skills you trust.", confidence: medium}
  - {id: CC-DUP-KEY, when: "frontmatter_duplicate_keys", effect: advisory, message: "Duplicate keys: Claude Code keeps the last value (four other harnesses drop the skill).", fix: "Remove the duplicate frontmatter key.", confidence: high}
  - {id: CC-BODY-CAP, when: "skill_md_bytes > 1048576", effect: not_loaded, outcome: rejected, message: "SKILL.md over 1 MB is rejected (bundle string skill_md_too_large).", fix: "Move detail into references/ files and keep SKILL.md under 1 MB.", confidence: medium}
  - {id: CC-CASING, when: "not manifest_name_exact", effect: degraded, message: "Non-canonical name (skill.md/Skill.md): loaded on case-insensitive filesystems (macOS default APFS, 3/3), ignored on case-sensitive Linux (3/3). Works or breaks depending on the OS.", fix: "Rename the file to SKILL.md (exact casing).", confidence: high}
  - {id: CC-CODEX-POLICY, when: "codex_implicit_disabled and not disable_model_invocation", effect: degraded, message: "agents/openai.yaml implicit-invocation policy is Codex-only: here the model can still use this skill on its own.", fix: "Also set disable-model-invocation: true (Claude Code, Copilot and OpenClaw honour it).", confidence: high}
  - {id: CC-FM-STRIPPED, when: "custom_field_chars > 200", effect: advisory, message: "Frontmatter is stripped when the skill is used, so the text in {custom_fields} never reaches the model.", fix: "Move instructions from frontmatter into the SKILL.md body.", confidence: medium}
  - {id: CC-FIELD-VALUE, when: "claude_ignored_values != ''", effect: advisory, message: "Loaded, but Claude Code ignores {claude_ignored_values}.", fix: "Use a value Claude Code accepts, or remove the field.", confidence: high}
notes:
  - "Follows symlinked skill folders and symlinked SKILL.md files, inside or outside the root."
  - "Nested SKILL.md, CRLF, BOM, tabs, uppercase names: no effect observed."
  - "New skills and edited bodies are picked up mid-session without restart."
plugin:
  rules:
    - {id: CC-PLUGIN-EMPTY, when: "not fmt_claude and not default_dirs", effect: not_loaded, outcome: not found, message: "No .claude-plugin/plugin.json and no skills/, commands/, agents/ or hooks/ folder: Claude Code finds nothing to load.", fix: "Add .claude-plugin/plugin.json or put components in the default folders.", confidence: high}
  components: {skills: delivered, commands: delivered, agents: delivered, hooks: runs, mcp: deferred, lsp: runs}
