harness: claude-code
display_name: Claude Code
verified: {version: 2.1.316, source: closed (bundled JS inspected), date: 2026-11-01, method: proxy-captured canary probes x3, os: linux}
roots:
  project: [.claude/skills]
  user: [~/.claude/skills]
  not_scanned: [.agents/skills, ~/.agents/skills]
rules:
  - {id: CC-ROOT, when: "install_root not in roots", effect: not_loaded, message: "Claude Code reads only .claude/skills and ~/.claude/skills; .agents/skills is not scanned.", confidence: high}
  - {id: CC-GROUPING, when: "grouping_depth > 0", effect: not_loaded, message: "Claude Code finds skills only directly under the skills folder; grouping folders are not searched.", confidence: high}
  - {id: CC-DESC-CUT, when: "description_codepoints > 1536", effect: degraded, message: "Description cut at 1,536 characters.", confidence: high}
  - {id: CC-DESC-MISSING, when: "description_missing or description_empty or description_type != 'str'", effect: degraded, message: "No usable description: Claude Code shows body text instead.", confidence: high}
  - {id: CC-LIST-BUDGET, when: "catalog_size > 0", effect: advisory, message: "Skill list budget is ~1% of context (~8,000 chars); with many skills descriptions are cut or dropped (names only seen at 225 skills).", confidence: medium}
  - {id: CC-PRECEDENCE, when: "always", effect: advisory, message: "Same name in user and project folders: the user copy wins (most other harnesses pick project).", confidence: high}
  - {id: CC-ALLOWED-TOOLS, when: "allowed_tools_shape != 'none'", effect: advisory, message: "allowed-tools only pre-approves tools, never restricts, and applies only when the skill is invoked through the Skill tool (e.g. /name), not when the model reads the file.", confidence: high}
  - {id: CC-DUP-KEY, when: "frontmatter_duplicate_keys", effect: advisory, message: "Duplicate keys: Claude Code keeps the last value (four other harnesses drop the skill).", confidence: high}
  - {id: CC-BODY-CAP, when: "skill_md_bytes > 1048576", effect: not_loaded, message: "SKILL.md over 1 MB is rejected (bundle string skill_md_too_large).", confidence: medium}
  - {id: CC-CASING, when: "not manifest_name_exact", effect: degraded, message: "Non-canonical name (skill.md/Skill.md): loaded on case-insensitive filesystems (macOS default APFS, 3/3), ignored on case-sensitive Linux (3/3). Works or breaks depending on the OS.", confidence: high}
notes:
  - "Follows symlinked skill folders and symlinked SKILL.md files, inside or outside the root."
  - "Nested SKILL.md, CRLF, BOM, tabs, uppercase names: no effect observed."
  - "New skills and edited bodies are picked up mid-session without restart."
