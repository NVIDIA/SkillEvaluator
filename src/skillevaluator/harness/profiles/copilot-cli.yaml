harness: copilot-cli
display_name: GitHub Copilot CLI
verified: {version: 1.0.105, source: closed (cli-main.js inspected), date: 2026-11-01, method: proxy-captured canary probes x3 (BYOK), os: linux}
roots:
  project: [.github/skills, .agents/skills, .claude/skills]
  user: [~/.copilot/skills, ~/.agents/skills]
listing: {drop_over_utf16: 1024}
rules:
  - {id: CP-ROOT, when: "install_root not in roots", effect: not_loaded, outcome: not found, message: "Copilot reads .github/.agents/.claude skills (project) and ~/.copilot or ~/.agents skills (user).", fix: "Install it under .github/skills, .agents/skills or .claude/skills.", confidence: high}
  - {id: CP-DESC-LIMIT, when: "description_utf16_units > 1024", effect: not_loaded, outcome: rejected, message: "Skill dropped: description is {description_utf16_units} UTF-16 units, {utf16_over} over the 1,024 limit (an emoji counts as 2).", fix: "Cut the description by at least {utf16_over} UTF-16 units.", confidence: high}
  - {id: CP-STRICT-YAML, when: "yaml_lenient_only or frontmatter_tab_indent or frontmatter_duplicate_keys or description_type not in ['str', 'none']", effect: not_loaded, message: "Skill dropped: Copilot's YAML parsing is strict.", fix: "Use spaces, not tabs, remove duplicate keys, and make the description a string.", confidence: high}
  - {id: CP-ALLOWED-TOOLS-MAP, when: "allowed_tools_shape == 'map'", effect: not_loaded, message: "Skill dropped: allowed-tools given as a map.", fix: "Give allowed-tools as a list or a space-separated string.", confidence: high}
  - {id: CP-DESC-MISSING, when: "description_missing", effect: degraded, message: "No description: Copilot shows body text instead.", fix: "Add a non-empty string description.", confidence: high}
  - {id: CP-LIST-BUDGET, when: "catalog_size > 32", effect: advisory, outcome: listing shortened, message: "{catalog_size} skills here: Copilot gives full descriptions to the first 32 only; the rest are listed by name.", fix: "Keep 32 or fewer skills in one place, or make names self-explanatory.", confidence: medium}
  - {id: CP-NESTED, when: "nested_skill_md", effect: advisory, message: "Nested SKILL.md is ignored.", fix: "Move the nested skill to its own folder under the skills root, or rename its SKILL.md.", confidence: medium}
  - {id: CP-RELOAD, when: "always", effect: advisory, message: "New skills appear only after `/skills reload` or a restart; edits to existing skills apply at once.", confidence: high}
  - {id: CP-ALLOWED-TOOLS, when: "allowed_tools_shape in ['string','list']", effect: advisory, message: "allowed-tools is ignored in -p (headless) mode; interactive behaviour unverified.", fix: "Don't rely on allowed-tools to restrict tools; use the harness's permission settings.", confidence: medium}
  - {id: CP-CASING, when: "not manifest_name_exact", effect: degraded, message: "Non-canonical name (skill.md/Skill.md): loaded on case-insensitive filesystems (macOS default APFS, 3/3), ignored on case-sensitive Linux (3/3). Works or breaks depending on the OS.", fix: "Rename the file to SKILL.md (exact casing).", confidence: high}
  - {id: CP-DUP-NAME, when: "duplicate_name", effect: advisory, message: "Another skill is also named '{skill_name}' ({duplicate_paths}); Copilot uses one, and the project copy wins.", fix: "Give each skill a unique name.", confidence: high}
  - {id: CP-CODEX-POLICY, when: "codex_implicit_disabled and not disable_model_invocation", effect: degraded, message: "agents/openai.yaml implicit-invocation policy is Codex-only: here the model can still use this skill on its own.", fix: "Also set disable-model-invocation: true (Claude Code, Copilot and OpenClaw honour it).", confidence: high}
  - {id: CP-ARGUMENTS, when: "uses_arguments_placeholder", effect: degraded, message: "$ARGUMENTS is not substituted: the model sees the literal text.", fix: "Describe the expected input in words instead of $ARGUMENTS.", confidence: high}
  - {id: CP-SKILL-DIR, when: "uses_claude_skill_dir", effect: degraded, message: "${CLAUDE_SKILL_DIR} is not substituted: the model sees the literal text.", fix: "Use paths relative to SKILL.md.", confidence: high}
  - {id: CP-CLAUDE-ONLY, when: "claude_only_fields != ''", effect: advisory, message: "Ignored here (Claude Code only): {claude_only_fields}.", fix: "Fine to keep for Claude Code; don't depend on them elsewhere.", confidence: medium}
  - {id: CP-FM-STRIPPED, when: "custom_field_chars > 200", effect: advisory, message: "Frontmatter is stripped when the skill is used, so the text in {custom_fields} never reaches the model.", fix: "Move instructions from frontmatter into the SKILL.md body.", confidence: medium}
notes:
  - "Docs say skills only in immediate subfolders; runtime finds them 3 grouping levels deep."
  - "Follows symlinks inside and outside the checkout (SDK docs say inside only)."
  - "Project copy wins on duplicate names (3/3); missing name falls back to the folder name."
