harness: copilot-cli
display_name: GitHub Copilot CLI
verified: {version: 1.0.105, source: closed (cli-main.js inspected), date: 2026-11-01, method: proxy-captured canary probes x3 (BYOK), os: linux}
roots:
  project: [.github/skills, .agents/skills, .claude/skills]
  user: [~/.copilot/skills, ~/.agents/skills]
rules:
  - {id: CP-ROOT, when: "install_root not in roots", effect: not_loaded, message: "Copilot reads .github/.agents/.claude skills (project) and ~/.copilot or ~/.agents skills (user).", confidence: high}
  - {id: CP-DESC-LIMIT, when: "description_utf16_units > 1024", effect: not_loaded, message: "Skill dropped: description over 1,024 UTF-16 units (emoji and other non-BMP characters count twice).", confidence: medium}
  - {id: CP-STRICT-YAML, when: "yaml_lenient_only or frontmatter_tab_indent or frontmatter_duplicate_keys or description_type != 'str'", effect: not_loaded, message: "Skill dropped: Copilot's YAML parsing is strict.", confidence: high}
  - {id: CP-ALLOWED-TOOLS-MAP, when: "allowed_tools_shape == 'map'", effect: not_loaded, message: "Skill dropped: allowed-tools given as a map.", confidence: high}
  - {id: CP-DESC-MISSING, when: "description_missing", effect: degraded, message: "No description: Copilot shows body text instead.", confidence: high}
  - {id: CP-LIST-BUDGET, when: "catalog_size > 32", effect: advisory, message: "With many skills only the first 32 get full descriptions; the rest are names only.", confidence: medium}
  - {id: CP-NESTED, when: "nested_skill_md", effect: advisory, message: "Nested SKILL.md is ignored.", confidence: medium}
  - {id: CP-RELOAD, when: "always", effect: advisory, message: "New skills appear only after `/skills reload` or a restart; edits to existing skills apply at once.", confidence: high}
  - {id: CP-ALLOWED-TOOLS, when: "allowed_tools_shape in ['string','list']", effect: advisory, message: "allowed-tools is ignored in -p (headless) mode; interactive behaviour unverified.", confidence: medium}
  - {id: CP-CASING, when: "not manifest_name_exact", effect: degraded, message: "Non-canonical name (skill.md/Skill.md): loaded on case-insensitive filesystems (macOS default APFS, 3/3), ignored on case-sensitive Linux (3/3). Works or breaks depending on the OS.", confidence: high}
notes:
  - "Docs say skills only in immediate subfolders; runtime finds them 3 grouping levels deep."
  - "Follows symlinks inside and outside the checkout (SDK docs say inside only)."
  - "Project copy wins on duplicate names (3/3); missing name falls back to the folder name."
