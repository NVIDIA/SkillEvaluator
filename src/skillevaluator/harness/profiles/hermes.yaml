harness: hermes
display_name: Hermes Agent
verified: {version: "main @ c419cf7c864a (binary reports 2026.9.24)", source: "NousResearch/hermes-agent c419cf7c864ac0ee511dbd9f7091a8bba0b567ee", date: 2026-11-01, method: proxy-captured canary probes x3 + source, os: linux}
roots:
  project: [.hermes/skills, .agents/skills]
  project_requires_trust: true
  user: [~/.hermes/skills]
  not_scanned: [~/.agents/skills]
limits: {listing_desc_chars: 60}
rules:
  - {id: HM-ROOT, when: "install_root not in roots", effect: not_loaded, message: "Hermes reads ~/.hermes/skills, and project .hermes/skills or .agents/skills only when trusted.", confidence: high}
  - {id: HM-TRUST, when: "install_root in roots.project", effect: advisory, message: "Project skills are invisible until the repo is trusted (`hermes skills trust`, skills.trusted_project_dirs).", confidence: high}
  - {id: HM-DESC-60, when: "trigger_offset is None or trigger_offset > 60", effect: degraded, message: "The skill list shows only the first ~60 characters of the description; put the trigger there.", confidence: high}
  - {id: HM-DESC-MISSING, when: "description_missing or description_empty", effect: degraded, message: "Listed by name with an empty description.", confidence: high}
  - {id: HM-NESTED, when: "nested_skill_md", effect: degraded, message: "The nested SKILL.md is loaded as a second, separate skill (hidden folders are walked too).", confidence: high}
  - {id: HM-SYMLINK-FILE, when: "skill_md_symlink", effect: not_loaded, message: "Symlinked SKILL.md files are not loaded; symlinked resource files are left out of the resource list.", confidence: medium}
  - {id: HM-DUP-KEY, when: "frontmatter_duplicate_keys", effect: advisory, message: "Duplicate keys: last value wins.", confidence: high}
  - {id: HM-ALLOWED-TOOLS, when: "allowed_tools_shape != 'none'", effect: advisory, message: "allowed-tools is ignored by Hermes.", confidence: high}
  - {id: HM-CASING, when: "not manifest_name_exact", effect: not_loaded, message: "Non-canonical name (skill.md/Skill.md): never loaded, on Linux or macOS (3/3 each).", confidence: high}
notes:
  - "Precedence: project > ~/.hermes/skills > skills.create_dir > external_dirs (project wins, 3/3)."
  - "Large bodies are spilled and paged through in small reads."
  - "Pin the commit: the displayed version string did not match the installed code."
