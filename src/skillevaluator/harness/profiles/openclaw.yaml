harness: openclaw
display_name: OpenClaw
verified: {version: 2026.10.9, source: "v2026.10.9 @ 88a19e0d8677", date: 2026-11-01, method: proxy-captured canary probes x3 + source, os: linux}
roots:
  project: [skills, .agents/skills]
  user: [~/.agents/skills, ~/.openclaw/skills]
limits: {max_skills_in_prompt: 150, max_prompt_chars: 18000, compact_desc_chars: 220, max_skill_file_bytes: 256000, read_budget: "32-128 KiB by model context"}
listing: {budget: {skills: 150, desc_chars: 18000, cut: 220}}
rules:
  - {id: OW-ROOT, when: "install_root not in roots", effect: not_loaded, message: "OpenClaw reads skills/, .agents/skills, ~/.agents/skills and ~/.openclaw/skills.", fix: "Install it under skills/ or .agents/skills in the workspace, or ~/.openclaw/skills.", confidence: high}
  - {id: OW-DESC-MISSING, when: "description_missing or description_empty", effect: not_loaded, message: "Skill dropped: no description.", fix: "Add a non-empty string description.", confidence: high}
  - {id: OW-STRICT-YAML, when: "frontmatter_tab_indent or frontmatter_duplicate_keys", effect: not_loaded, message: "Skill dropped: invalid YAML (tabs or duplicate keys).", fix: "Use spaces, not tabs, and remove duplicate keys.", confidence: high}
  - {id: OW-SYMLINK-ESCAPE, when: "skill_dir_symlink_target == 'outside_root'", effect: not_loaded, message: "Symlink target is outside the skills root (even inside the repo): rejected.", fix: "Copy the skill into the skills folder instead of symlinking it from elsewhere.", confidence: high}
  - {id: OW-SYMLINK-FILE, when: "skill_md_symlink", effect: not_loaded, message: "Symlinked SKILL.md files are not loaded.", fix: "Copy SKILL.md into the folder instead of symlinking the file (a symlinked folder works).", confidence: high}
  - {id: OW-FILE-CAP, when: "skill_md_bytes > 256000", effect: not_loaded, message: "SKILL.md over 256,000 bytes is skipped as invalid.", fix: "Move detail into references/ files and keep SKILL.md under 256,000 bytes.", confidence: high}
  - {id: OW-READ-REFUSED, when: "skill_md_chars > 64000", effect: degraded, message: "SKILL.md is {skill_md_chars} chars, over the 64,000-char tool-result cap: skill instructions are served whole or not at all, so the read is refused at every context size.", fix: "Keep SKILL.md under 16,000 characters to load at every context size; move detail into references/ files.", versions: "2026.9+; 2026.3.x pages the file instead", confidence: high}
  - {id: OW-READ-BUDGET, when: "skill_md_chars > 16000 and skill_md_chars <= 64000", effect: degraded, message: "SKILL.md is {skill_md_chars} chars; skill instructions are served whole or not at all, so the read is refused on models under 200K context (cap 16,000 chars under 100K, 32,000 under 200K).", fix: "Keep SKILL.md under 16,000 characters; move detail into references/ files.", versions: "2026.9+; 2026.3.x pages the file instead", confidence: high}
  - {id: OW-COMPACT, when: "description_codepoints > 220 and (catalog_size > 150 or catalog_desc_chars > 18000)", effect: degraded, message: "{catalog_size} skills / {catalog_desc_chars} description chars here: over 150 skills or 18,000 chars, OpenClaw cuts descriptions to 220 chars.", fix: "Keep the description under 220 characters, trigger first.", confidence: high}
  - {id: OW-NESTED, when: "nested_skill_md", effect: advisory, message: "Nested SKILL.md is ignored.", fix: "Move the nested skill to its own folder under the skills root, or rename its SKILL.md.", confidence: medium}
  - {id: OW-ALLOWED-TOOLS, when: "allowed_tools_shape != 'none'", effect: advisory, message: "allowed-tools is ignored by OpenClaw.", fix: "Don't rely on allowed-tools to restrict tools; use the harness's permission settings.", confidence: high}
  - {id: OW-CASING, when: "not manifest_name_exact", effect: degraded, message: "Non-canonical name (skill.md/Skill.md): loaded on case-insensitive filesystems (macOS default APFS, 3/3), ignored on case-sensitive Linux (3/3). Works or breaks depending on the OS.", fix: "Rename the file to SKILL.md (exact casing).", confidence: high}
  - {id: OW-PROMPT-CAP, when: "catalog_size > 150 or catalog_desc_chars > 18000", effect: advisory, message: "{catalog_size} skills / {catalog_desc_chars} description chars here: past 150 skills or 18,000 chars OpenClaw also leaves skills out of the list (121 of 225 listed in our test).", fix: "Shorten descriptions (trigger first) or install fewer skills in one folder.", confidence: high}
  - {id: OW-DUP-NAME, when: "duplicate_name", effect: advisory, message: "Another skill is also named '{skill_name}' ({duplicate_paths}); OpenClaw uses one: workspace skills/, then .agents/skills, then user folders.", fix: "Give each skill a unique name.", confidence: high}
  - {id: OW-REQUIRES, when: "openclaw_gates != ''", effect: advisory, message: "Left out of the skill list unless the host has: {openclaw_gates}.", fix: "Make sure target hosts provide these, or drop requirements the skill doesn't need.", confidence: high}
  - {id: OW-REF-BUDGET, when: "largest_resource_bytes > 32768", effect: advisory, message: "{largest_resource} is {largest_resource_bytes} bytes; OpenClaw's read tool returns 32-128 KiB per call (by model context), so it takes several reads.", fix: "Split large reference files into pieces under 32 KiB.", confidence: medium}
  - {id: OW-CODEX-POLICY, when: "codex_implicit_disabled and not disable_model_invocation", effect: degraded, message: "agents/openai.yaml implicit-invocation policy is Codex-only: here the model can still use this skill on its own.", fix: "Also set disable-model-invocation: true (Claude Code, Copilot and OpenClaw honour it).", confidence: high}
  - {id: OW-ARGUMENTS, when: "uses_arguments_placeholder", effect: degraded, message: "$ARGUMENTS is not substituted: the model sees the literal text.", fix: "Describe the expected input in words instead of $ARGUMENTS.", confidence: medium}
  - {id: OW-SKILL-DIR, when: "uses_claude_skill_dir", effect: degraded, message: "${CLAUDE_SKILL_DIR} is not substituted: the model sees the literal text.", fix: "Use paths relative to SKILL.md.", confidence: medium}
  - {id: OW-CLAUDE-ONLY, when: "claude_only_fields != ''", effect: advisory, message: "Ignored here (Claude Code only): {claude_only_fields}.", fix: "Fine to keep for Claude Code; don't depend on them elsewhere.", confidence: medium}
notes:
  - "Precedence: workspace skills/ > .agents/skills > ~/.agents/skills > managed > bundled > extra dirs (project wins, 3/3)."
  - "Description given as a YAML list is stringified and listed. BOM, CRLF, bare colons tolerated."
  - "New skills listed next turn in `openclaw chat`; files re-read from disk."
