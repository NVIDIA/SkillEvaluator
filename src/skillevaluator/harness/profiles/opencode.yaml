harness: opencode
display_name: OpenCode
verified: {version: 1.19.5, source: "v1.19.5 @ 810c0eba1a73", date: 2026-11-01, method: proxy-captured canary probes x3 + source, os: linux}
roots:
  project: [.opencode/skills, .opencode/skill, .claude/skills, .agents/skills]
  user: [~/.config/opencode/skills, ~/.claude/skills, ~/.agents/skills]
limits: {scan_depth: unlimited, desc_cap: none, list_cap: none, tool_output: "2,000 lines / 50 KB, rest spilled to a file"}
rules:
  - {id: OC-ROOT, when: "install_root not in roots", effect: not_loaded, message: "OpenCode reads .opencode, .claude and .agents skill folders.", confidence: high}
  - {id: OC-NAME-MISSING, when: "name_missing", effect: not_loaded, message: "Skill dropped: OpenCode requires a name.", confidence: high}
  - {id: OC-DESC-MISSING, when: "description_missing or description_type != 'str'", effect: not_loaded, message: "Loaded but hidden from the model's skill list (no string description).", confidence: high}
  - {id: OC-DESC-EMPTY, when: "description_empty", effect: degraded, message: "Listed by name only.", confidence: high}
  - {id: OC-DUP-KEY, when: "frontmatter_duplicate_keys", effect: not_loaded, message: "Skill dropped: duplicate frontmatter keys.", confidence: high}
  - {id: OC-NESTED, when: "nested_skill_md", effect: degraded, message: "The nested SKILL.md is loaded as a second, separate skill.", confidence: high}
  - {id: OC-BODY-CUT, when: "skill_md_bytes > 51200 or skill_md_lines > 2000", effect: degraded, message: "Skill text is cut at 50 KB / 2,000 lines; the model must read the rest from a spill file.", confidence: high}
  - {id: OC-DUP-NAME, when: "always", effect: advisory, message: "Same name in two roots: the winner is random per run (concurrent loading, last write wins).", confidence: high}
  - {id: OC-RELOAD, when: "always", effect: advisory, message: "Skill list and text are cached at startup; edits need a restart.", confidence: high}
  - {id: OC-ALLOWED-TOOLS, when: "allowed_tools_shape != 'none'", effect: advisory, message: "allowed-tools is ignored by OpenCode.", confidence: high}
  - {id: OC-CASING, when: "not manifest_name_exact", effect: degraded, message: "Non-canonical name (skill.md/Skill.md): loaded on case-insensitive filesystems (macOS default APFS, 3/3), ignored on case-sensitive Linux (3/3). Works or breaks depending on the OS.", confidence: high}
notes:
  - "Docs (V1) say one level deep and a 1-1024 description; runtime matches the V2 docs: recursive, no length cap."
  - "Tolerant of tabs, bare colons and BOM. Follows all symlinks tested."
