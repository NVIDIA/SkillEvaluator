harness: pi
display_name: pi Coding Agent
verified: {version: 1.6.0, source: "npm @earendil-works/pi-coding-agent", date: 2026-11-20, method: "source inspection (dist/core/skills.js)", os: macos}
roots:
  project: [.pi/skills, .agents/skills]
  user: [~/.pi/agent/skills, ~/.agents/skills]
limits: {desc_cap: none, body_cap: none}
listing: {}
rules:
  - {id: PI-ROOT, when: "install_root not in roots", effect: not_loaded, outcome: not found, message: "pi reads project .pi/skills and .agents/skills, and user ~/.pi/agent/skills and ~/.agents/skills.", fix: "Install it under one of those skills roots.", confidence: high}
  - {id: PI-UNPARSEABLE, when: "frontmatter_missing", effect: not_loaded, outcome: dropped, message: "Skill dropped: without frontmatter there is no description to list.", fix: "Add frontmatter with a description.", confidence: high}
  - {id: PI-DESC-MISSING, when: "description_missing or description_empty or description_type != 'str'", effect: not_loaded, outcome: dropped, message: "Skill dropped: pi requires a string description to list.", fix: "Add a non-empty string description.", confidence: high}
  - {id: PI-FRONTMATTER-DUPKEYS, when: "frontmatter_duplicate_keys", effect: not_loaded, outcome: dropped, message: "Skill dropped: duplicate frontmatter keys make the YAML unparseable.", fix: "Remove the duplicate frontmatter key.", confidence: high}
  - {id: PI-FRONTMATTER-TABS, when: "frontmatter_tab_indent", effect: not_loaded, outcome: dropped, message: "Skill dropped: tab-indented frontmatter is not valid YAML.", fix: "Indent frontmatter with spaces, not tabs.", confidence: high}
  - {id: PI-NAME-COLLISION, when: "duplicate_name", effect: degraded, message: "Another skill is also named '{skill_name}' ({duplicate_paths}); pi keeps the first one it loads and drops the other, so this one loads only if it wins the scan order.", fix: "Give each skill a unique name.", confidence: high}
  - {id: PI-CASING, when: "not manifest_name_exact", effect: not_loaded, outcome: dropped, message: "Skill dropped: pi compares the exact directory entry name, so skill.md/Skill.md is ignored on every OS and filesystem.", fix: "Rename the file to SKILL.md (exact casing).", confidence: high}
  - {id: PI-HIDDEN, when: "disable_model_invocation", effect: degraded, outcome: hidden, message: "Kept out of the model's skill list; only the user can load it (/skill:name).", fix: "Remove disable-model-invocation to let the model use this skill on its own.", confidence: high}
  - {id: PI-NAME-FALLBACK, when: "name_missing", effect: advisory, outcome: renamed, message: "Loads under the folder name; the frontmatter name is optional.", fix: "Add a name field to control the listed name explicitly.", confidence: high}
  - {id: PI-DESC-LONG, when: "description_codepoints > 1024", effect: advisory, message: "pi warns about descriptions over 1024 characters but delivers the full text; nothing is truncated.", fix: "Keep the description under 1024 characters.", confidence: medium}

plugin:
  rules:
    - {id: PI-PLUGIN-NONE, when: "always", effect: not_loaded, outcome: rejected, message: "pi has no plugin package format; it loads skills from ~/.agents/skills and rules from its own config only.", fix: "Ship the work as plain skill directories under a skills root.", confidence: high}
  components: {skills: listed, commands: not_observed, agents: not_observed, hooks: not_observed, mcp: not_observed, lsp: not_observed}
notes:
  - "First folder wins a name collision; later same-name skills are dropped with a warning."
  - "Tolerant of BOM, CRLF and tabs inside values; a loose .md file loads only under a skills root."
  - "The skill list is built at startup; new skills need a new session."
